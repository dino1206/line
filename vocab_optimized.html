<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>單字騎士團 - AI 升級版 v2026.06.20-ai-auto-proxy</title>
    <meta name="description" content="結合 RPG 戰鬥與 AI 技術的英文單字學習遊戲，讓背單字變成一場冒險！">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"Press Start 2P"', 'cursive'],
                        body: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; }

        /* === 遊戲動畫特效 === */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-8deg); }
            40% { transform: translateX(10px) rotate(8deg); }
            60% { transform: translateX(-10px) rotate(-8deg); }
            80% { transform: translateX(10px) rotate(8deg); }
        }
        .anim-shake { animation: shake 0.4s ease-in-out; }

        @keyframes fly-right {
            0% { transform: translate(-40px, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-20px, 0) scale(1.5); opacity: 1; }
            80% { transform: translate(20px, 0) scale(1.5); opacity: 1; }
            100% { transform: translate(40px, 0) scale(2); opacity: 0; }
        }
        .anim-fly-right { animation: fly-right 0.25s linear forwards; }

        @keyframes fly-left {
            0% { transform: translate(40px, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(20px, 0) scale(1.5); opacity: 1; }
            80% { transform: translate(-20px, 0) scale(1.5); opacity: 1; }
            100% { transform: translate(-40px, 0) scale(2); opacity: 0; }
        }
        .anim-fly-left { animation: fly-left 0.25s linear forwards; }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
        .anim-explode { animation: explode 0.4s ease-out forwards; }

        @keyframes explode-huge {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; filter: hue-rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(2.5); opacity: 1; filter: hue-rotate(45deg); }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; filter: hue-rotate(90deg); }
        }
        .anim-explode-huge { animation: explode-huge 0.5s ease-out forwards; }

        @keyframes cloud-drift {
            from { transform: translateX(-50px); }
            to { transform: translateX(300px); }
        }
        .anim-cloud { animation: cloud-drift 40s linear infinite; }
        .anim-cloud-slow { animation: cloud-drift 60s linear infinite reverse; }

        /* === 新增視覺特效 === */
        .ai-glow { box-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 0 40px rgba(168, 85, 247, 0.2); }

        /* Glassmorphism 卡片 */
        .glass-card {
            background: rgba(255, 251, 235, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* XP 經驗條動畫 */
        @keyframes xp-fill {
            from { width: var(--xp-from, 0%); }
            to { width: var(--xp-to, 0%); }
        }
        .xp-bar-fill {
            animation: xp-fill 1s ease-out forwards;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #eab308);
        }
        .xp-bar-fill-animated {
            animation: xp-fill 1.5s ease-out forwards;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #eab308);
        }

        /* 按鈕發光效果 */
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.5), 0 4px 15px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }
        .btn-glow:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Streak 火焰動畫 */
        @keyframes flame-pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.15); filter: brightness(1.3); }
        }
        .flame-pulse { animation: flame-pulse 0.5s ease-in-out infinite; }

        @keyframes streak-pop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .streak-pop { animation: streak-pop 0.4s ease-out; }

        /* Combo 文字飛出 */
        @keyframes combo-fly {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            30% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.8); opacity: 0; }
        }
        .combo-fly { animation: combo-fly 1s ease-out forwards; }

        /* 答對時螢幕邊緣閃光 */
        @keyframes correct-flash {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }
        .correct-flash {
            animation: correct-flash 0.6s ease-out forwards;
            pointer-events: none;
        }

        /* 答錯紅色 overlay */
        @keyframes wrong-flash {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }
        .wrong-flash {
            animation: wrong-flash 0.5s ease-out forwards;
            pointer-events: none;
        }

        /* HP 低血量脈動 */
        @keyframes hp-critical {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .hp-critical { animation: hp-critical 0.6s ease-in-out infinite; }

        /* XP 數字跳動 */
        @keyframes xp-count {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #eab308; }
            100% { transform: scale(1); }
        }
        .xp-counting { animation: xp-count 0.1s ease-in-out; }

        /* 升級特效 */
        @keyframes level-up {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .level-up-anim { animation: level-up 0.8s ease-out forwards; }

        @keyframes confetti-fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100px) rotate(720deg); opacity: 0; }
        }

        /* 粒子星星背景 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        /* 設定面板展開動畫 */
        .settings-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out, opacity 0.35s ease-out, padding 0.35s ease-out;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
        .settings-panel.open {
            max-height: 400px;
            opacity: 1;
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        /* 連勝等級的文字色 */
        .streak-bronze { color: #cd7f32; text-shadow: 0 0 8px rgba(205,127,50,0.5); }
        .streak-silver { color: #c0c0c0; text-shadow: 0 0 10px rgba(192,192,192,0.6); }
        .streak-gold { color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.7); }
        .streak-diamond { color: #b9f2ff; text-shadow: 0 0 20px rgba(185,242,255,0.8); }

        /* 分享按鈕 */
        .btn-share {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.2s ease;
        }
        .btn-share:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* 滑動進入 */
        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slide-up 0.4s ease-out; }

        /* 每日 badge pulse */
        @keyframes badge-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(34,197,94,0.5); }
            50% { box-shadow: 0 0 15px rgba(34,197,94,0.8); }
        }
        .badge-glow { animation: badge-glow 2s ease-in-out infinite; }
    </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden flex flex-col items-center justify-center p-0 sm:py-6 sm:px-4 font-body text-gray-900" style="background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);">

    <!-- 星星粒子背景 -->
    <div id="stars-bg" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- 全螢幕閃光層 -->
    <div id="screen-flash" class="fixed inset-0 z-[100] pointer-events-none hidden"></div>

    <div id="app-root" class="w-full max-w-lg flex flex-col h-full sm:h-auto sm:max-h-[900px] relative z-10">
        
        <!-- ===== 載入畫面 ===== -->
        <div id="screen-loading" class="glass-card w-full h-full sm:h-auto p-8 rounded-none sm:rounded-2xl shadow-2xl flex flex-col items-center justify-center m-auto max-w-sm border-0 sm:border border-amber-200/50">
            <div id="loading-icon" class="text-5xl sm:text-6xl mb-6 animate-spin">⏳</div>
            <h2 id="loading-title" class="text-xl sm:text-2xl font-black text-amber-900 text-center">載入戰役資料中...</h2>
            <p id="loading-desc" class="text-sm sm:text-base text-amber-700 font-bold mt-2 text-center">啟動記憶篩選演算法</p>
            <div class="mt-4 w-48 h-1.5 bg-amber-200 rounded-full overflow-hidden">
                <div class="h-full bg-amber-500 rounded-full animate-pulse" style="width: 60%;"></div>
            </div>
        </div>

        <!-- ===== 錯誤畫面 ===== -->
        <div id="screen-error" class="hidden glass-card w-full h-full sm:h-auto p-6 sm:p-8 rounded-none sm:rounded-2xl shadow-2xl flex flex-col justify-center items-center m-auto max-w-sm text-center border-0 sm:border sm:border-red-300/50">
            <div class="text-5xl sm:text-6xl mb-4">⚠️</div>
            <h2 class="text-xl sm:text-2xl font-black text-red-700 mb-4">系統異常</h2>
            <p id="error-msg" class="text-sm sm:text-base text-amber-900 mb-6 font-bold break-words px-2"></p>
            <button onclick="window.location.reload()" class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-bold text-lg sm:text-xl py-3 rounded-xl shadow-lg active:translate-y-[2px] transition-all">重新整理</button>
        </div>

        <!-- ===== 首頁 (重新設計) ===== -->
        <div id="screen-start" class="hidden glass-card w-full h-full sm:h-auto rounded-none sm:rounded-2xl shadow-2xl flex flex-col justify-start items-center text-center border-0 sm:border sm:border-amber-200/30 relative overflow-y-auto m-auto max-w-md">
            
            <!-- 頂部等級區 -->
            <div class="w-full px-5 pt-5 pb-3">
                <div class="flex items-center justify-between mb-1">
                    <div class="text-left">
                        <h1 class="font-pixel text-base sm:text-lg text-amber-900 tracking-wider leading-relaxed">⚔️ 單字騎士團</h1>
                        <div class="mt-1 inline-flex items-center rounded-full bg-purple-100 border border-purple-200 px-2 py-0.5 text-[10px] font-black text-purple-700">
                            v2026.06.20-ai-auto-proxy
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="daily-badge" class="text-[10px] font-black text-white bg-green-600 px-2 py-0.5 rounded-full badge-glow hidden">今日 <span id="daily-count">0</span> 題</span>
                        <span id="streak-days-badge" class="text-[10px] font-black text-orange-100 bg-orange-500 px-2 py-0.5 rounded-full hidden">🔥 <span id="streak-days">0</span> 天</span>
                    </div>
                </div>
                
                <!-- 等級 & XP 條 -->
                <div id="level-section" class="bg-gradient-to-r from-amber-100 to-yellow-100 rounded-xl p-3 border border-amber-200 shadow-sm mt-2">
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center gap-2">
                            <span id="level-icon" class="text-2xl">🛡️</span>
                            <div class="text-left">
                                <div class="text-xs font-black text-amber-800">Lv.<span id="level-num">1</span></div>
                                <div id="level-title" class="text-[10px] font-bold text-amber-600">見習騎士</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] font-bold text-amber-500"><span id="xp-current">0</span> / <span id="xp-needed">100</span> XP</div>
                        </div>
                    </div>
                    <div class="w-full h-2.5 bg-amber-900/20 rounded-full overflow-hidden">
                        <div id="xp-bar" class="h-full rounded-full xp-bar-fill transition-all duration-500" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- 戰鬥場景預覽 -->
            <div class="flex justify-center items-center gap-2 sm:gap-4 h-20 sm:h-24 mx-5 mb-3 bg-gradient-to-b from-sky-300 to-sky-400 border border-amber-900/30 rounded-xl relative overflow-hidden w-[calc(100%-2.5rem)] shrink-0 shadow-inner">
                <div class="absolute bottom-0 w-full h-5 sm:h-7 bg-green-500/80 border-t-2 border-green-600/50"></div>
                <div id="start-hero-wrap" class="z-10"></div>
                <span class="text-xl sm:text-3xl z-10 drop-shadow-md">⚔️</span>
                <div id="start-monster-wrap" class="z-10"></div>
                <div class="absolute top-2 right-3 text-[10px] sm:text-xs font-black text-white/80 bg-black/20 px-2 py-0.5 rounded-full backdrop-blur-sm">
                    <span id="start-count">0</span> 題
                </div>
            </div>

            <!-- 快速開始按鈕 -->
            <div class="w-full px-5 mb-3">
                <button onclick="startNormalGame()" class="w-full bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 hover:from-yellow-300 hover:via-amber-300 hover:to-yellow-400 text-amber-950 font-black text-lg sm:text-xl py-3.5 rounded-xl border-2 border-amber-600/50 shadow-lg btn-glow transition-all duration-200 flex items-center justify-center gap-2">
                    🗡️ 進入戰場！
                </button>
            </div>

            <!-- 可收合設定面板 -->
            <div class="w-full px-5 mb-3">
                <button onclick="toggleSettings()" class="w-full flex items-center justify-between text-amber-700 font-bold text-xs sm:text-sm py-2 px-3 bg-amber-100/60 rounded-lg hover:bg-amber-100 transition-colors">
                    <span>⚙️ 遊戲設定</span>
                    <span id="settings-arrow" class="transition-transform duration-300">▼</span>
                </button>
                <div id="settings-panel" class="settings-panel px-3">
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center justify-between bg-amber-100/80 p-2 rounded-lg">
                            <label for="game-mode" class="font-bold text-amber-900 text-xs sm:text-sm">🎮 遊戲模式</label>
                            <select id="game-mode" onchange="updateGameMode(this.value)" class="font-bold text-amber-900 text-xs sm:text-sm bg-white border border-amber-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer">
                                <option value="mixed">混合模式</option>
                                <option value="choice">全部選擇</option>
                                <option value="spell">全部拼字</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between bg-amber-100/80 p-2 rounded-lg">
                            <label for="challenge-count" class="font-bold text-amber-900 text-xs sm:text-sm">⚔️ 挑戰題數</label>
                            <select id="challenge-count" onchange="updateChallengeCount(this.value)" class="font-bold text-amber-900 text-xs sm:text-sm bg-white border border-amber-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer">
                            </select>
                        </div>
                        <div class="text-center text-amber-600 text-[10px] sm:text-xs font-bold">
                            選擇題 攻<span id="start-choice-dmg"></span> ／ 拼字題 攻<span id="start-spell-dmg"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI 拍照出題 -->
            <div class="w-full px-5 mb-3">
                <div class="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-xl p-3 border border-purple-200/60">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-black text-purple-800">✨ AI 魔法模式</span>
                        <div class="flex gap-1">
                            <select id="ai-game-mode" class="font-bold text-purple-800 text-[10px] bg-white border border-purple-200 rounded px-1.5 py-0.5 focus:outline-none cursor-pointer">
                                <option value="mixed">混合</option>
                                <option value="choice">選擇</option>
                                <option value="spell">拼字</option>
                            </select>
                            <select id="ai-challenge-count" class="font-bold text-purple-800 text-[10px] bg-white border border-purple-200 rounded px-1.5 py-0.5 focus:outline-none cursor-pointer">
                                <option value="auto" selected>自動題數</option>
                                <option value="10">10題</option>
                                <option value="20">20題</option>
                                <option value="30">30題</option>
                                <option value="50">50題</option>
                                <option value="80">80題</option>
                            </select>
                        </div>
                    </div>
                    <input type="file" id="ai-image-upload" accept="image/*" class="hidden" onchange="handleAIImageUpload(event)">
                    <button onclick="document.getElementById('ai-image-upload').click()" class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-400 hover:to-indigo-400 text-white font-black text-sm sm:text-base py-2.5 rounded-lg shadow-md ai-glow active:translate-y-[1px] transition-all flex items-center justify-center gap-2">
                        📸 拍照識圖出題
                    </button>
                </div>
            </div>

            <!-- 底部入口 -->
            <div class="w-full px-5 pb-5 mt-auto">
                <button onclick="showHistoryScreen()" class="text-amber-600 font-bold text-xs sm:text-sm hover:text-amber-500 transition-colors flex items-center justify-center gap-1 w-full py-2">
                    📜 查看歷次戰役紀錄
                </button>
            </div>
        </div>

        <!-- ===== 歷史紀錄畫面 ===== -->
        <div id="screen-history" class="hidden glass-card w-full h-full sm:h-auto p-4 sm:p-6 rounded-none sm:rounded-2xl shadow-2xl flex flex-col justify-start sm:justify-center items-center text-center border-0 sm:border sm:border-amber-200/30 m-auto max-w-md">
            <h2 class="text-xl sm:text-2xl font-black text-amber-900 mb-4 mt-2 sm:mt-0 drop-shadow-sm shrink-0">📜 歷次戰役紀錄</h2>
            <div class="w-full flex-1 overflow-y-auto bg-amber-50/80 border border-amber-200 rounded-xl p-2 mb-4 space-y-1 shadow-inner min-h-[200px]">
                <div id="history-list-content"></div>
            </div>
            <button onclick="showScreen('screen-start')" class="w-full bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-400 hover:to-indigo-400 text-white font-black text-lg sm:text-xl py-3 rounded-xl shadow-lg active:translate-y-[1px] transition-all shrink-0">
                🔙 返回首頁
            </button>
        </div>

        <!-- ===== 遊戲進行畫面 ===== -->
        <div id="screen-playing" class="hidden glass-card sm:rounded-2xl shadow-2xl border-0 sm:border sm:border-amber-200/30 flex-col h-full w-full overflow-hidden" style="background: rgba(255,251,235,0.95);">
            
            <!-- 頂部導航列 -->
            <div class="flex flex-col shrink-0">
                <div class="flex justify-between items-center px-3 py-1.5 sm:py-2 bg-gradient-to-r from-amber-100 to-amber-200/80 border-b border-amber-300/50">
                    <button onclick="showScreen('screen-start')" class="text-xs sm:text-sm font-black text-amber-800 hover:text-red-600 transition-colors flex items-center gap-1 py-1 px-1 -ml-1">
                        🏠 撤退
                    </button>
                    <div class="flex items-center gap-2">
                        <!-- Streak 顯示 -->
                        <div id="streak-display" class="hidden items-center gap-1 text-xs font-black">
                            <span id="streak-fire" class="text-base">🔥</span>
                            <span id="streak-num" class="text-amber-900">×0</span>
                        </div>
                        <span id="ai-mode-badge" class="hidden text-[10px] sm:text-xs font-black text-purple-700 bg-purple-100 border border-purple-300 px-2 py-0.5 rounded-full">AI</span>
                        <span id="progress-text" class="text-xs sm:text-sm font-bold text-amber-600">0 / 0</span>
                    </div>
                </div>
                <!-- HP 區域 -->
                <div class="bg-amber-50/80 p-1.5 sm:p-2 flex justify-between items-center border-b border-amber-200/50">
                    <div class="flex flex-col items-start w-[44%] mx-1.5">
                        <span class="text-[10px] sm:text-xs font-black text-amber-900 mb-0.5">我方 HP: <span id="hero-hp-text"></span></span>
                        <div id="hero-hp-bar" class="w-full h-3 sm:h-3.5 bg-gray-900/80 rounded-sm border border-amber-900/30 p-[1px] flex gap-[1px] overflow-hidden"></div>
                    </div>
                    <div class="text-sm sm:text-base font-black text-amber-800 mx-1">VS</div>
                    <div class="flex flex-col items-end w-[44%] mx-1.5">

        // === 新增：Streak & XP 相關 ===

        // === XP 等級系統 ===
        const LEVEL_TABLE = [
            { level: 1, title: '見習騎士', icon: '🛡️', xp: 100 },
            { level: 2, title: '銅劍衛兵', icon: '⚔️', xp: 250 },

            { level: 5, title: '金盾騎士', icon: '🛡️', xp: 1200 },
            { level: 6, title: '聖光法師', icon: '🪄', xp: 1800 },

        function getPlayerData() {
            try { return JSON.parse(localStorage.getItem('vocabKnightPlayer')) || { xp: 0, level: 1 }; }
            catch { return { xp: 0, level: 1 }; }
        }
        function savePlayerData(data) { localStorage.setItem('vocabKnightPlayer', JSON.stringify(data)); }

        function getLevelInfo(level) {
            return LEVEL_TABLE.find(l => l.level === level) || LEVEL_TABLE[LEVEL_TABLE.length - 1];
        }
        function getXPForNextLevel(level) {
            const info = LEVEL_TABLE.find(l => l.level === level);
            return info ? info.xp : LEVEL_TABLE[LEVEL_TABLE.length - 1].xp;
        }
        function getXPForPrevLevel(level) {
            if (level <= 1) return 0;
            const prev = LEVEL_TABLE.find(l => l.level === level - 1);
            return prev ? prev.xp : 0;
        }

        function addXP(amount) {
            const player = getPlayerData();
            const oldLevel = player.level;
            player.xp += amount;
            
            // 檢查升級
            let leveled = false;
            while (true) {
                const needed = getXPForNextLevel(player.level);
                if (player.xp >= needed && player.level < LEVEL_TABLE.length) {
                    player.level++;
                    leveled = true;
                } else {
                    break;
                }
            }
            savePlayerData(player);
            return { newLevel: player.level, oldLevel, leveled, totalXP: player.xp };
        }

        function updateLevelUI() {
            const player = getPlayerData();
            const info = getLevelInfo(player.level);
            const prevXP = getXPForPrevLevel(player.level);
            const nextXP = getXPForNextLevel(player.level);
            const progress = nextXP > prevXP ? ((player.xp - prevXP) / (nextXP - prevXP)) * 100 : 100;

            const levelNum = document.getElementById('level-num');
            const levelTitle = document.getElementById('level-title');
            const levelIcon = document.getElementById('level-icon');
            const xpCurrent = document.getElementById('xp-current');
            const xpNeeded = document.getElementById('xp-needed');
            const xpBar = document.getElementById('xp-bar');

            if (levelNum) levelNum.textContent = player.level;
            if (levelTitle) levelTitle.textContent = info.title;
            if (levelIcon) levelIcon.textContent = info.icon;
            if (xpCurrent) xpCurrent.textContent = player.xp;
            if (xpNeeded) xpNeeded.textContent = nextXP;
            if (xpBar) xpBar.style.width = Math.min(progress, 100) + '%';
        }

        // === 每日統計 ===
        function getDailyStats() {
            try {
                const data = JSON.parse(localStorage.getItem('vocabKnightDaily')) || {};
                const today = new Date().toISOString().split('T')[0];
                if (data.date !== today) return { date: today, count: 0, streakDays: data.streakDays || 0, lastDate: data.date || '' };
                return data;
            } catch { return { date: new Date().toISOString().split('T')[0], count: 0, streakDays: 0, lastDate: '' }; }
        }
        function saveDailyStats(stats) { localStorage.setItem('vocabKnightDaily', JSON.stringify(stats)); }

        function addDailyCount(n) {
            const stats = getDailyStats();
            const today = new Date().toISOString().split('T')[0];
            
            if (stats.date !== today) {
                // 新的一天
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                const newStreakDays = (stats.date === yesterday) ? (stats.streakDays || 0) + 1 : 1;
                stats.date = today;
                stats.count = n;
                stats.streakDays = newStreakDays;
            } else {
                stats.count += n;
            }
            saveDailyStats(stats);
            updateDailyUI();
        }

        function updateDailyUI() {
            const stats = getDailyStats();
            const dailyBadge = document.getElementById('daily-badge');
            const dailyCount = document.getElementById('daily-count');
            const streakDaysBadge = document.getElementById('streak-days-badge');
            const streakDays = document.getElementById('streak-days');

            if (stats.count > 0 && dailyBadge) {
                dailyBadge.classList.remove('hidden');
                dailyCount.textContent = stats.count;
            }
            if (stats.streakDays > 1 && streakDaysBadge) {
                streakDaysBadge.classList.remove('hidden');
                streakDays.textContent = stats.streakDays;
            }
        }

        // =====================================================
        // === 工具：CSV & Storage ===
        // =====================================================
        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const getVocabStats = () => { try { return JSON.parse(localStorage.getItem('vocabHeroStats')) || {}; } catch { return {}; } };
        const updateVocabStats = (wordEn, isCorrect) => {
            const stats = getVocabStats();
            if (!stats[wordEn]) stats[wordEn] = { correct: 0, wrong: 0 };
            isCorrect ? stats[wordEn].correct += 1 : stats[wordEn].wrong += 1;
            localStorage.setItem('vocabHeroStats', JSON.stringify(stats));
        };

        const saveGameRecord = (isWin, answered, total) => {
            const records = JSON.parse(localStorage.getItem('vocabHeroHistory')) || [];
            const date = new Date();
            const dateStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
            records.unshift({
                date: dateStr,
                result: isWin ? '戰鬥勝利 🏆' : '全軍覆沒 💀',
                progress: `${answered}/${total}`,
                isWin: isWin,
                isAi: isAiSession,
                accuracy: sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0,
                maxStreak: maxStreak,
                xpGained: sessionXP
            });
            if (records.length > 50) records.pop();
            localStorage.setItem('vocabHeroHistory', JSON.stringify(records));
        };

        const getGameRecordsHTML = () => {
            const records = JSON.parse(localStorage.getItem('vocabHeroHistory')) || [];
            if (records.length === 0) return '<div class="text-center text-amber-600 py-6 font-bold text-sm">尚無戰役紀錄，快去挑戰吧！</div>';
            return records.map(r => `
                <div class="flex justify-between items-center bg-white/70 p-2 rounded-lg border border-amber-100">
                    <div class="flex flex-col text-left">
                        <span class="text-[10px] text-amber-500 font-bold leading-none mb-1">${r.date} ${r.isAi ? '<span class="text-purple-600 bg-purple-50 px-1 rounded text-[9px]">AI</span>' : ''}</span>
                        <span class="text-xs font-black ${r.isWin ? 'text-green-600' : 'text-red-500'}">${r.result}</span>
                    </div>
                    <div class="text-right flex items-center gap-2">
                        ${r.maxStreak ? `<span class="text-[9px] text-orange-500 font-bold">🔥${r.maxStreak}</span>` : ''}
                        ${r.xpGained ? `<span class="text-[9px] text-yellow-600 font-bold">+${r.xpGained}XP</span>` : ''}
                        <span class="text-xs font-black text-blue-700">${r.progress} 題</span>
                    </div>
                </div>
            `).join('');
        };

        // =====================================================
        // === 畫面控制 ===
        // =====================================================
        window.showScreen = (id) => {
            ['screen-loading', 'screen-error', 'screen-start', 'screen-playing', 'screen-end', 'screen-history'].forEach(sid => {

            else { monsterImgUrl = null; img.outerHTML = `<div class="text-5xl sm:text-6xl md:text-7xl filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]">👾</div>`; }
        };

        // =====================================================
        // === Gemini AI 圖片解析 ===
        // =====================================================
        const delay = ms => new Promise(res => setTimeout(res, ms));
        
        async function fetchGeminiWithBackoff(prompt, base64Data, mimeType, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const geminiPayload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: mimeType, data: base64Data } }
                    ]
                }],
                generationConfig: { responseMimeType: "application/json" }
            };

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(geminiProxyUrl || url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(geminiProxyUrl
                            ? { prompt, image: base64Data, mimeType }
                            : geminiPayload
                        )
                    });
                    if (!response.ok) throw new Error(`API 錯誤狀態: ${response.status}`);
                    const result = await response.json();
                    
                    if (Array.isArray(result)) return result;
                    if (Array.isArray(result.data)) return result.data;

                    if(result.candidates && result.candidates[0].content.parts[0].text) {
                        return JSON.parse(result.candidates[0].content.parts[0].text);
                    } else {
                        throw new Error("API 回傳格式異常");
                    }
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await delay(delays[i]);
                }
            }
        }

        window.handleAIImageUpload = (event) => {
            if (!apiKey && !geminiProxyUrl) {
                document.getElementById('error-msg').innerText = "尚未載入 API Key！\n請確認 vocabapi.txt 存在，並使用本地伺服器(Local Server)執行網頁以支援讀取外部檔案。";
                window.showScreen('screen-error');
                event.target.value = '';
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loading-icon').innerText = '📸';
            document.getElementById('loading-icon').classList.remove('animate-spin');
            document.getElementById('loading-icon').classList.add('animate-pulse');
            document.getElementById('loading-title').innerText = 'AI 正在解析圖片...';
            document.getElementById('loading-desc').innerText = '這可能需要幾秒鐘，請施展耐心魔法！';
            window.showScreen('screen-loading');

            const reader = new FileReader();
            reader.onload = async (e) => {
                const fullBase64 = e.target.result;
                const mimeType = fullBase64.split(';')[0].split(':')[1];
                const rawBase64 = fullBase64.split(',')[1];
                
                const aiCountSetting = document.getElementById('ai-challenge-count').value || 'auto';
                const isAutoAIQuizCount = aiCountSetting === 'auto';
                const aiTargetCount = isAutoAIQuizCount ? 80 : parseInt(aiCountSetting, 10);
                
                const prompt = `Analyze this image carefully.
                Task 1: Detect if the image is a document, test paper, textbook, or vocabulary list containing English words.
                If it IS a document with words: Extract as many DISTINCT English vocabulary words as possible from the visible text, up to ${aiTargetCount} words. Do NOT stop at 20 if more usable words are visible.
                If it is NOT a document (e.g., a photo of a room, toys, nature): Identify ${isAutoAIQuizCount ? `up to ${Math.min(aiTargetCount, 30)}` : `exactly ${aiTargetCount}`} prominent objects, concepts, colors, or actions visually shown.
                
                Task 2: Format the output STRICTLY as a JSON array of objects. Do not wrap in markdown \`\`\`json. 
                Each object MUST have exactly these keys:
                "zh": Traditional Chinese translation of the word.
                "en": The English word.
                "phonetic": IPA pronunciation.
                "example": A very short, simple example sentence using the word in English ONLY (do NOT include Chinese translation).`;

                try {
                    const aiGeneratedWords = await fetchGeminiWithBackoff(prompt, rawBase64, mimeType);
                    
                    if (!Array.isArray(aiGeneratedWords) || aiGeneratedWords.length === 0) {
                        throw new Error("AI 無法從圖片中找出合適的單字，換張圖片試試吧！");
                    }
                    
                    const seenAIWords = new Set();
                    const normalizedAIWords = aiGeneratedWords
                        .map(item => ({
                            zh: (item.zh || '').toString().trim(),
                            en: (item.en || '').toString().trim(),
                            phonetic: (item.phonetic || '').toString().trim(),
                            example: (item.example || '').toString().trim()
                        }))
                        .filter(item => {
                            const key = item.en.toLowerCase();
                            if (!item.zh || !item.en || seenAIWords.has(key)) return false;
                            seenAIWords.add(key);
                            return true;
                        });

                    const selectedAIWords = isAutoAIQuizCount
                        ? normalizedAIWords
                        : normalizedAIWords.slice(0, aiTargetCount);

                    if (selectedAIWords.length < 4) {
                        throw new Error(`AI 只辨識到 ${selectedAIWords.length} 個可用單字，至少需要 4 個單字才能開始戰鬥。`);
                    }
                    
                    vocabulary = selectedAIWords;
                    allVocabulary = [...selectedAIWords, ...allVocabulary]; 
                    
                    isAiSession = true;
                    globalGameMode = document.getElementById('ai-game-mode').value;
                    
                    resetLoadingUI();
                    startSession();
                    
                } catch (err) {
                    resetLoadingUI();
                    document.getElementById('error-msg').innerText = err.message || "魔法解析失敗，請確認網路連線或換張圖片！";
                    window.showScreen('screen-error');
                }
                
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        };

        function resetLoadingUI() {
            document.getElementById('loading-icon').innerText = '⏳';
            document.getElementById('loading-icon').classList.add('animate-spin');
            document.getElementById('loading-icon').classList.remove('animate-pulse');
            document.getElementById('loading-title').innerText = '載入戰役資料中...';
            document.getElementById('loading-desc').innerText = '啟動記憶篩選演算法';
        }

        // =====================================================
        // === 初始化 ===
        // =====================================================
        async function initGame() {
            generateStars();
            window.showScreen('screen-loading');
            try {
                try {
                    const apiResponse = await fetch('vocabapi.txt');
                    if (apiResponse.ok) {
                        const apiText = await apiResponse.text();
                        const aiConfig = apiText.split('\n')[0].trim();
                        if (aiConfig.startsWith('http')) {
                            geminiProxyUrl = aiConfig;
                        } else {
                            apiKey = aiConfig;
                        }
                    } else {
                        console.warn("找不到 vocabapi.txt 檔案，AI 圖片辨識功能將無法使用。");
                    }
                } catch (err) {
                    console.warn("無法讀取 vocabapi.txt。如果是直接點擊 HTML 檔案 (file://)，請改用 Local Server 執行。");
                }

                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('無法連線到試算表，請確認權限是否為公開！');
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                const parsedVocab = [];
                
                if (rows.length > 0) {
                    const customHero = rows[0][4]?.trim();
                    const customMonster = rows[0][5]?.trim();
                    const isValidImg = (url) => url && (url.startsWith('http') || url.startsWith('data:image'));
                    if (isValidImg(customHero)) heroImgUrl = customHero;
                    if (isValidImg(customMonster)) monsterImgUrl = customMonster;
                }
                
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length >= 2) {
                        const zh = row[0]?.trim();
                        const en = row[1]?.trim();
                        const phonetic = row[2]?.trim() || '';
                        const example = row[3]?.trim() || '';
                        if (zh && en && zh !== '中文' && en !== '英文') {
                            parsedVocab.push({ zh, en, phonetic, example });
                        }
                    }
                }

                if (parsedVocab.length < 4) throw new Error(`單字數量不足 (${parsedVocab.length}個)！至少需要 4 個單字。`);
                
                allVocabulary = parsedVocab;

                const stats = getVocabStats();
                weightedAllVocab = parsedVocab.map(word => {
                    const wordStats = stats[word.en] || { correct: 0, wrong: 0 };
                    let weight = 1.0;
                    if (wordStats.correct >= 2) weight = 0.2; 
                    if (wordStats.wrong >= 2) weight = 5.0;   
                    return { word, score: Math.pow(Math.random(), 1 / weight) };
                });
                weightedAllVocab.sort((a, b) => b.score - a.score);
                
                const totalWords = weightedAllVocab.length;
                const selectEl = document.getElementById('challenge-count');
                selectEl.innerHTML = '';
                const presetOptions = [10, 20, 30, 50, 100];
                presetOptions.forEach(num => {
                    if (totalWords > num) { 
                        selectEl.innerHTML += `<option value="${num}">${num} 題</option>`;
                    }
                });
                selectEl.innerHTML += `<option value="${totalWords}">全部 (${totalWords} 題)</option>`;
                
                if (totalWords >= 50) {
                    selectEl.value = '50';
                } else {
                    selectEl.value = totalWords.toString();
                }

                updateChallengeCount(selectEl.value);
                
                document.getElementById('start-hero-wrap').innerHTML = heroImgUrl 
                    ? `<img src="${heroImgUrl}" onerror="handleImgFallback(this, 'hero')" class="h-14 w-14 sm:h-16 sm:w-16 object-contain animate-bounce drop-shadow-md" />`
                    : `<div class="text-4xl sm:text-5xl animate-bounce drop-shadow-md">🦸‍♂️</div>`;
                document.getElementById('start-monster-wrap').innerHTML = monsterImgUrl 
                    ? `<img src="${monsterImgUrl}" onerror="handleImgFallback(this, 'monster')" class="h-14 w-14 sm:h-16 sm:w-16 object-contain animate-pulse drop-shadow-md" />`
                    : `<div class="text-4xl sm:text-5xl animate-pulse drop-shadow-md">👾</div>`;

                updateLevelUI();
                updateDailyUI();
                
                // 每日初次登入檢查
                const daily = getDailyStats();
                const today = new Date().toISOString().split('T')[0];
                if (daily.date !== today && daily.streakDays > 0) {
                    addDailyCount(0); // 更新 streak days
                }

                window.showScreen('screen-start');
            } catch (err) {
                document.getElementById('error-msg').innerText = err.message;
                window.showScreen('screen-error');
            }
        }

        // =====================================================
        // === 星星粒子背景 ===
        // =====================================================
        function generateStars() {
            const container = document.getElementById('stars-bg');
            const count = 60;
            let html = '';
            for (let i = 0; i < count; i++) {
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const dur = 2 + Math.random() * 4;
                const d = Math.random() * 5;
                const size = 1 + Math.random() * 2;
                html += `<div class="star" style="left:${x}%;top:${y}%;--dur:${dur}s;--delay:${d}s;width:${size}px;height:${size}px;"></div>`;
            }
            container.innerHTML = html;
        }

        // =====================================================
        // === 設定更新 ===
        // =====================================================
        window.updateGameMode = (val) => {};

        window.updateChallengeCount = (val) => {
            const count = parseInt(val, 10);
            vocabulary = weightedAllVocab.slice(0, count).map(item => item.word);
            
            document.getElementById('start-count').innerText = vocabulary.length;
            const choiceDmg = vocabulary.length > 0 ? (MONSTER_MAX_HP / vocabulary.length) : 2;
            document.getElementById('start-choice-dmg').innerText = Math.round(choiceDmg * 10) / 10;
            document.getElementById('start-spell-dmg').innerText = Math.round(choiceDmg * 2 * 10) / 10;
        };

        // =====================================================
        // === 遊戲開始 ===
        // =====================================================
        window.startNormalGame = () => {
            isAiSession = false;
            globalGameMode = document.getElementById('game-mode').value;
            updateChallengeCount(document.getElementById('challenge-count').value);
            startSession();
        };
        window.startGame = startNormalGame;

        window.replayGame = () => {
            // 保持當前設定直接重新開始
            startSession();
        };

        function startSession() {
            heroHp = HERO_MAX_HP;
            monsterHp = MONSTER_MAX_HP;
            isAnimating = false;
            currentStreak = 0;
            maxStreak = 0;
            sessionCorrect = 0;
            sessionTotal = 0;
            sessionXP = 0;
            
            if (globalGameMode === 'spell') {
                answerMode = 'spell';
            } else {
                answerMode = 'choice';
            }

            remainingVocab = [...vocabulary].sort(() => Math.random() - 0.5);
            
            document.getElementById('play-hero-sprite').innerHTML = heroImgUrl 
                ? `<img src="${heroImgUrl}" onerror="handlePlayImgFallback(this, 'hero')" class="w-16 h-16 sm:w-20 sm:h-20 md:w-28 md:h-28 object-contain bg-transparent filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]" />`
                : `<div class="text-5xl sm:text-6xl md:text-7xl filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]">🦸‍♂️</div>`;
            document.getElementById('play-monster-sprite').innerHTML = monsterImgUrl 
                ? `<img src="${monsterImgUrl}" onerror="handlePlayImgFallback(this, 'monster')" class="w-16 h-16 sm:w-20 sm:h-20 md:w-28 md:h-28 object-contain bg-transparent filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]" />`
                : `<div class="text-5xl sm:text-6xl md:text-7xl filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]">👾</div>`;

            const aiBadge = document.getElementById('ai-mode-badge');
            if(isAiSession) {
                aiBadge.classList.remove('hidden');
                aiBadge.classList.add('inline-block');
            } else {
                aiBadge.classList.add('hidden');
                aiBadge.classList.remove('inline-block');
            }

            // 重置 streak 顯示
            updateStreakDisplay();
            updateHpUI();
            generateQuestion();
            window.showScreen('screen-playing');
        }

        // =====================================================
        // === Streak 連勝系統 ===
        // =====================================================
        function updateStreakDisplay() {
            const display = document.getElementById('streak-display');
            const fire = document.getElementById('streak-fire');
            const num = document.getElementById('streak-num');

            if (currentStreak >= 2) {
                display.classList.remove('hidden');
                display.classList.add('flex');
                num.textContent = `×${currentStreak}`;

                // 不同等級的視覺效果
                if (currentStreak >= 10) {
                    num.className = 'streak-diamond font-black text-sm streak-pop';
                    fire.className = 'text-lg flame-pulse';
                    fire.textContent = '💎';
                } else if (currentStreak >= 5) {
                    num.className = 'streak-gold font-black text-sm streak-pop';
                    fire.className = 'text-lg flame-pulse';
                    fire.textContent = '🔥';
                } else if (currentStreak >= 3) {
                    num.className = 'streak-bronze font-black text-xs streak-pop';
                    fire.className = 'text-base';
                    fire.textContent = '🔥';
                } else {
                    num.className = 'text-amber-700 font-black text-xs streak-pop';
                    fire.className = 'text-base';
                    fire.textContent = '🔥';
                }
            } else {
                display.classList.add('hidden');
                display.classList.remove('flex');
            }
        }

        function showComboText(streak) {
            const layer = document.getElementById('combo-layer');
            let text = '';
            let colorClass = '';
            
            if (streak >= 10) { text = `💎 LEGENDARY ×${streak}！`; colorClass = 'text-cyan-300'; }
            else if (streak >= 7) { text = `🔥 UNSTOPPABLE ×${streak}！`; colorClass = 'text-yellow-300'; }
            else if (streak >= 5) { text = `⚡ AMAZING ×${streak}！`; colorClass = 'text-yellow-400'; }
            else if (streak >= 3) { text = `✨ COMBO ×${streak}！`; colorClass = 'text-orange-400'; }
            else return;

            layer.innerHTML = `<div class="combo-fly font-pixel text-xs sm:text-sm font-black ${colorClass} drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${text}</div>`;
        }

        function showScreenFlash(isCorrect) {
            const flash = document.getElementById('screen-flash');
            flash.classList.remove('hidden');
            if (isCorrect) {
                flash.style.boxShadow = 'inset 0 0 80px rgba(34,197,94,0.4)';
                flash.className = 'fixed inset-0 z-[100] correct-flash';
            } else {
                flash.style.boxShadow = 'inset 0 0 80px rgba(239,68,68,0.4)';
                flash.className = 'fixed inset-0 z-[100] wrong-flash';
            }
            setTimeout(() => {
                flash.classList.add('hidden');
                flash.className = 'fixed inset-0 z-[100] pointer-events-none hidden';
            }, 600);
        }

        // =====================================================
        // === HP UI ===
        // =====================================================
        function updateHpUI() {
            let hHtml = '';
            const isLow = heroHp <= 2 && heroHp > 0;
            for(let i=0; i<HERO_MAX_HP; i++) {
                const pct = (heroHp / HERO_MAX_HP) * 100;
                const hc = pct > 50 ? 'bg-green-500' : pct > 20 ? 'bg-yellow-400' : 'bg-red-500';
                const colorClass = i < heroHp ? hc : 'bg-gray-800';
                const hl = i < heroHp ? `<div class="absolute top-0 left-0 w-full h-[2px] bg-white opacity-40"></div>` : '';
                const critClass = isLow && i < heroHp ? 'hp-critical' : '';
                hHtml += `<div class="flex-1 h-full ${colorClass} ${critClass} relative transition-colors duration-300 rounded-[1px]">${hl}</div>`;
            }
            document.getElementById('hero-hp-bar').innerHTML = hHtml;
            document.getElementById('hero-hp-text').innerText = Math.ceil(heroHp);

            const mPct = (monsterHp / MONSTER_MAX_HP) * 100;
            const mc = mPct > 50 ? 'bg-green-500' : mPct > 20 ? 'bg-yellow-400' : 'bg-red-500';
            document.getElementById('monster-hp-bar').innerHTML = `
                <div class="w-full h-full bg-transparent relative">
                  <div class="h-full ${mc} transition-all duration-300 ease-out rounded-[1px]" style="width: ${mPct}%">
                    <div class="absolute top-0 left-0 w-full h-[2px] bg-white opacity-40"></div>
                  </div>
                </div>`;
            document.getElementById('monster-hp-text').innerText = Math.ceil(monsterHp);
        }

        // =====================================================
        // === 出題 ===
        // =====================================================
        function generateQuestion() {
            if (remainingVocab.length === 0) remainingVocab = [...vocabulary].sort(() => Math.random() - 0.5);
            currentWord = remainingVocab.pop();
            
            let wrongWords = [];
            let fallbackPool = allVocabulary.length >= 4 ? allVocabulary : vocabulary;
            
            let attempts = 0;
            while (wrongWords.length < 3 && attempts < 100) {
                const randWord = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
                if (randWord.en !== currentWord.en && !wrongWords.includes(randWord)) wrongWords.push(randWord);
                attempts++;
            }
            while(wrongWords.length < 3) {
                wrongWords.push({zh: `未知魔法${Math.floor(Math.random()*100)}`, en: 'unknown'});
            }

            options = [currentWord, ...wrongWords].sort(() => Math.random() - 0.5);
            
            document.getElementById('spell-input').value = '';
            document.getElementById('progress-text').innerText = `${vocabulary.length - remainingVocab.length} / ${vocabulary.length}`;
            renderUI();
        }

        window.handleModeSwitch = (newMode) => {
            if (isAnimating || answerMode === newMode || globalGameMode !== 'mixed') return;
            answerMode = newMode;
            generateQuestion();
        };

        function renderUI() {
            const modeSwitcher = document.getElementById('mode-switcher-container');
            const btnChoice = document.getElementById('btn-mode-choice');
            const btnSpell = document.getElementById('btn-mode-spell');
            
            const dmgChoice = vocabulary.length > 0 ? (MONSTER_MAX_HP / vocabulary.length) : 2;
            const dmgSpell = dmgChoice * 2;
            const currentDmg = answerMode === 'choice' ? dmgChoice : dmgSpell;
    
            document.getElementById('lbl-choice-dmg').innerText = Math.round(dmgChoice*10)/10;
            document.getElementById('lbl-spell-dmg').innerText = Math.round(dmgSpell*10)/10;

            if (globalGameMode === 'mixed') {
                modeSwitcher.classList.remove('hidden');
                modeSwitcher.classList.add('flex');
            } else {
                modeSwitcher.classList.add('hidden');
                modeSwitcher.classList.remove('flex');
            }

            if (answerMode === 'choice') {
                btnChoice.className = 'flex-1 py-1.5 sm:py-2 font-black text-xs sm:text-sm rounded-lg transition-all bg-amber-200 text-amber-900 border-2 border-amber-600/50 shadow-md';
                btnSpell.className = 'flex-1 py-1.5 sm:py-2 font-black text-xs sm:text-sm rounded-lg transition-all bg-red-50/60 text-red-300 border border-red-200/50 opacity-60';
                
                document.getElementById('options-grid').classList.remove('hidden');
                document.getElementById('spell-form').classList.add('hidden');
                document.getElementById('spell-form').classList.remove('flex');
                
                document.getElementById('options-grid').innerHTML = options.map((opt, i) => `
                    <button onclick="submitChoice(${i})" class="bg-white/80 border-2 border-amber-300/80 hover:bg-amber-50 hover:border-amber-500 hover:shadow-md text-amber-900 font-black text-sm sm:text-base py-2.5 rounded-xl shadow-sm active:translate-y-[1px] active:shadow-none transition-all leading-tight min-h-[2.5rem] px-2">${opt.zh}</button>
                `).join('');
            } else {
                btnChoice.className = 'flex-1 py-1.5 sm:py-2 font-black text-xs sm:text-sm rounded-lg transition-all bg-amber-50/60 text-amber-400 border border-amber-200/50 opacity-60';
                btnSpell.className = 'flex-1 py-1.5 sm:py-2 font-black text-xs sm:text-sm rounded-lg transition-all bg-red-100 text-red-800 border-2 border-red-500/50 shadow-md';
                
                document.getElementById('options-grid').classList.add('hidden');
                document.getElementById('spell-form').classList.remove('hidden');
                document.getElementById('spell-form').classList.add('flex');
                
                const inp = document.getElementById('spell-input');
                const sub = document.getElementById('spell-submit');
                inp.disabled = false;
                sub.disabled = true;
                inp.focus();
            }

            let qText = answerMode === 'choice' ? '請選擇正確的單字意思：' : '請拼出這個單字的英文：';
            if (globalGameMode !== 'mixed') {
                qText += ` (攻擊力 ${Math.round(currentDmg * 10) / 10})`;
            }
            document.getElementById('question-type-text').innerText = qText;
            
            const mw = document.getElementById('main-word');
            mw.innerText = answerMode === 'choice' ? currentWord.en : currentWord.zh;
            mw.className = `text-2xl sm:text-4xl md:text-5xl font-black tracking-wide break-words drop-shadow-sm leading-tight shrink-0 ${answerMode === 'choice' ? 'text-blue-800' : 'text-red-700'}`;

            const ph = document.getElementById('word-phonetic');
            if (currentWord.phonetic) { ph.innerText = currentWord.phonetic; ph.classList.remove('hidden'); } 
            else { ph.classList.add('hidden'); }

            const ex = document.getElementById('word-example');
            if (currentWord.example) {
                let safeExample = currentWord.example;
                if (answerMode === 'spell') {
                    const regex = new RegExp(currentWord.en, 'gi');
                    safeExample = safeExample.replace(regex, '______');
                }
                ex.innerHTML = `<span class="font-bold mr-1">💬</span>${safeExample}`;
                ex.classList.remove('hidden');
            } else {
                ex.classList.add('hidden');
            }
        }

        // =====================================================
        // === 答題 & 動畫邏輯 ===
        // =====================================================
        document.getElementById('spell-input').addEventListener('input', (e) => {
            document.getElementById('spell-submit').disabled = isAnimating || !e.target.value.trim();
        });

        window.submitChoice = (index) => handleAnswer(options[index], false);
        window.submitSpell = (e) => {
            e.preventDefault();
            const val = document.getElementById('spell-input').value.trim();
            if(val && !isAnimating) handleAnswer(val, true);
        };

        function setSpriteAnim(type, classes) {
            const wrap = document.getElementById(type === 'hero' ? 'play-hero-sprite' : 'play-monster-sprite');
            const el = wrap.firstElementChild;
            if(el) {
                const isImg = el.tagName === 'IMG';
                const baseClass = isImg ? "w-16 h-16 sm:w-20 sm:h-20 md:w-28 md:h-28 object-contain bg-transparent filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]" : "text-5xl sm:text-6xl md:text-7xl filter drop-shadow-[2px_4px_0_rgba(0,0,0,0.4)]";
                el.className = `${baseClass} ${classes}`;
            }
        }

        function handleAnswer(answerData, isSpelling) {
            isAnimating = true;
            sessionTotal++;

            if(isSpelling) {
                document.getElementById('spell-input').disabled = true;
                document.getElementById('spell-submit').disabled = true;
            } else {
                const btns = document.getElementById('options-grid').querySelectorAll('button');
                btns.forEach(b => b.disabled = true);
            }

            const isCorrect = isSpelling 
                ? (answerData.toLowerCase() === currentWord.en.toLowerCase()) 
                : (answerData.en === currentWord.en);

            const choiceDmg = vocabulary.length > 0 ? (MONSTER_MAX_HP / vocabulary.length) : 2;
            const dmg = isSpelling ? choiceDmg * 2 : choiceDmg;

            updateVocabStats(currentWord.en, isCorrect);

            const fbLayer = document.getElementById('feedback-layer');
            const fbText = document.getElementById('feedback-text');
            const proj = document.getElementById('projectile-layer');
            const expHero = document.getElementById('hero-explosion');
            const expMon = document.getElementById('monster-explosion');

            if (isCorrect) {
                // === 答對邏輯 ===
                sessionCorrect++;
                currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;

                // XP 計算
                let xpGain = isSpelling ? 25 : 10;
                if (currentStreak >= 10) xpGain += 15;
                else if (currentStreak >= 5) xpGain += 10;
                else if (currentStreak >= 3) xpGain += 5;
                sessionXP += xpGain;

                updateStreakDisplay();
                showComboText(currentStreak);
                showScreenFlash(true);

                fbText.innerText = isSpelling ? '🔥 知識暴擊！' : '⭕ 課本飛擊！';
                fbText.className = `text-xs sm:text-lg font-black px-3 py-2 rounded-xl shadow-lg animate-bounce inline-block break-words text-white ${isSpelling ? 'bg-gradient-to-r from-red-500 to-orange-500' : 'bg-gradient-to-r from-blue-500 to-cyan-500'}`;
                fbLayer.classList.remove('hidden');

                const dashAnim = isSpelling 
                    ? 'translate-x-4 sm:translate-x-8 -translate-y-4 sm:-translate-y-8 scale-125 sm:scale-150 rotate-12 transition-all duration-200 filter drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]'
                    : 'translate-x-4 sm:translate-x-6 -translate-y-4 sm:-translate-y-6 scale-110 sm:scale-125 rotate-12 transition-all duration-200';
                setSpriteAnim('hero', dashAnim);
                
                setTimeout(() => {
                    setSpriteAnim('hero', 'transition-all duration-200');
                    proj.innerHTML = `<div class="text-4xl sm:text-6xl anim-fly-right filter drop-shadow-lg ${isSpelling ? 'scale-150' : ''}">${isSpelling ? '📚' : '📖'}</div>`;

                    setTimeout(() => {
                        proj.innerHTML = '';
                        setSpriteAnim('monster', `anim-shake filter drop-shadow-[0_0_${isSpelling ? '30px' : '15px'}_rgba(239,68,68,0.9)]`);
                        expMon.className = `absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-5xl sm:text-7xl ${isSpelling ? 'anim-explode-huge' : 'anim-explode'} z-30 pointer-events-none drop-shadow-lg`;
                        expMon.classList.remove('hidden');

                        monsterHp = Math.max(0, monsterHp - dmg);
                        updateHpUI();

                        setTimeout(() => {
                            setSpriteAnim('monster', 'transition-all duration-200');
                            expMon.classList.add('hidden');
                            fbLayer.classList.add('hidden');
                            checkGameEnd();
                        }, 600);
                    }, 500);
                }, isSpelling ? 300 : 250);

            } else {
                // === 答錯邏輯 ===
                currentStreak = 0;
                updateStreakDisplay();
                showScreenFlash(false);

                fbText.innerText = isSpelling ? `❌ 拼錯了！正解：${currentWord.en}` : `❌ 答錯了！正解：${currentWord.zh}`;
                fbText.className = 'text-xs sm:text-lg font-black px-3 py-2 rounded-xl shadow-lg animate-bounce inline-block break-words bg-gradient-to-r from-red-600 to-rose-600 text-white';
                fbLayer.classList.remove('hidden');

                setSpriteAnim('monster', '-translate-x-4 sm:-translate-x-6 -translate-y-4 sm:-translate-y-6 scale-110 sm:scale-125 -rotate-12 transition-all duration-200');

                setTimeout(() => {
                    setSpriteAnim('monster', 'transition-all duration-200');
                    const cosmeticIcons = ['💄', '💅', '🧴', '🪞'];
                    const randomCosmetic = cosmeticIcons[Math.floor(Math.random() * cosmeticIcons.length)];
                    proj.innerHTML = `<div class="text-4xl sm:text-6xl anim-fly-left filter drop-shadow-lg">${randomCosmetic}</div>`;

                    setTimeout(() => {
                        proj.innerHTML = '';
                        setSpriteAnim('hero', 'anim-shake filter drop-shadow-[0_0_15px_rgba(239,68,68,0.9)]');
                        expHero.classList.remove('hidden');

                        heroHp = Math.max(0, heroHp - 1);
                        updateHpUI();
                    }, 500);

                    setTimeout(() => {
                        setSpriteAnim('hero', 'transition-all duration-200');
                        expHero.classList.add('hidden');
                        fbLayer.classList.add('hidden');
                        checkGameEnd();
                    }, 2500);
                }, 250);
            }
        }

        // =====================================================
        // === 結算 ===
        // =====================================================
        function checkGameEnd() {
            if (monsterHp <= 0 || heroHp <= 0) {
                const isWin = monsterHp <= 0;
                
                const total = vocabulary.length;
                const answered = total - remainingVocab.length;

                // 勝利 bonus XP
                if (isWin) sessionXP += 50;
                
                saveGameRecord(isWin, answered, total);
                addDailyCount(sessionTotal);

                // XP 結算
                const xpResult = addXP(sessionXP);

                // 結算 UI
                document.getElementById('end-title').innerText = isWin ? '戰鬥勝利！' : '全軍覆沒...';
                document.getElementById('end-title').className = `text-3xl sm:text-5xl font-black mb-2 drop-shadow-sm ${isWin ? 'text-green-600' : 'text-red-500'}`;
                document.getElementById('end-desc').innerText = isWin ? '敵方魔物已被擊退！' : '勇者的光芒黯淡了，請重新站起來！';
                
                const iw = document.getElementById('end-icon-wrap');
                if(isWin) {
                    iw.innerHTML = heroImgUrl 
                        ? `<img src="${heroImgUrl}" onerror="this.onerror=null; this.outerHTML='<div class=\\'text-6xl sm:text-7xl animate-bounce drop-shadow-lg\\'>🏆</div>'" class="h-16 w-16 sm:h-20 sm:w-20 object-contain drop-shadow-lg animate-bounce" />`
                        : `<div class="text-6xl sm:text-7xl animate-bounce drop-shadow-lg">🏆</div>`;
                } else {
                    iw.innerHTML = `<span class="text-6xl sm:text-7xl drop-shadow-lg">💀</span>`;
                }

                // 統計
                const accuracy = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;
                document.getElementById('end-accuracy').textContent = accuracy + '%';
                document.getElementById('end-max-streak').textContent = maxStreak;

                // XP 動畫計數
                animateXPCount(sessionXP);

                // XP 進度條
                const endXPSection = document.getElementById('end-xp-section');
                endXPSection.classList.remove('hidden');
                
                const levelInfo = getLevelInfo(xpResult.newLevel);
                document.getElementById('end-level').textContent = xpResult.newLevel;
                document.getElementById('end-level-title').textContent = levelInfo.title;
                
                const prevXP = getXPForPrevLevel(xpResult.newLevel);
                const nextXP = getXPForNextLevel(xpResult.newLevel);
                const progress = nextXP > prevXP ? ((xpResult.totalXP - prevXP) / (nextXP - prevXP)) * 100 : 100;
                
                document.getElementById('end-xp-cur').textContent = xpResult.totalXP;
                document.getElementById('end-xp-max').textContent = nextXP;
                
                const endBar = document.getElementById('end-xp-bar');
                endBar.style.setProperty('--xp-from', '0%');
                endBar.style.setProperty('--xp-to', Math.min(progress, 100) + '%');
                endBar.style.width = '0%';
                setTimeout(() => {
                    endBar.style.width = Math.min(progress, 100) + '%';
                }, 100);

                // 升級提示
                const levelupEl = document.getElementById('end-levelup');
                if (xpResult.leveled) {
                    levelupEl.classList.remove('hidden');
                    const newInfo = getLevelInfo(xpResult.newLevel);
                    document.getElementById('levelup-text').textContent = `Lv.${xpResult.newLevel} ${newInfo.icon} ${newInfo.title}`;
                } else {
                    levelupEl.classList.add('hidden');
                }

                document.getElementById('end-history-list-content').innerHTML = getGameRecordsHTML();

                window.showScreen('screen-end');
            } else {
                isAnimating = false;
                generateQuestion();
            }
        }

        function animateXPCount(target) {
            const el = document.getElementById('end-xp-gained');
            let current = 0;
            const step = Math.max(1, Math.ceil(target / 30));
            const interval = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(interval);
                }
                el.textContent = `+${current}`;
                el.classList.add('xp-counting');
                setTimeout(() => el.classList.remove('xp-counting'), 80);
            }, 40);
        }

        // =====================================================
        // === 分享功能 ===
        // =====================================================
        window.shareResult = async () => {
            const player = getPlayerData();
            const levelInfo = getLevelInfo(player.level);
            const accuracy = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;
            const isWin = monsterHp <= 0;
            
            const text = `⚔️ 單字騎士團 戰報 ⚔️
${isWin ? '🏆 戰鬥勝利！' : '💀 全軍覆沒...'}
📊 答對率：${accuracy}%
🔥 最高連勝：${maxStreak}
✨ 獲得 ${sessionXP} XP
${levelInfo.icon} Lv.${player.level} ${levelInfo.title}
🎮 來挑戰 → web.ntnu.edu.tw/~yishiou/vocab/`;

            try {
                await navigator.clipboard.writeText(text);
                const btn = event.target.closest('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ 已複製！';
                btn.classList.add('bg-green-500');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-500');
                }, 2000);
            } catch (e) {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('戰報已複製到剪貼簿！');
            }
        };

        // =====================================================
        // === 啟動 ===
        // =====================================================
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
