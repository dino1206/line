<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧去背小幫手</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 棋盤格背景樣式 */
    .checkerboard {
      background-image: 
        linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
        linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
        linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: white;
    }
    
    /* 防止畫布在手機上觸控時引發網頁滑動 */
    canvas {
      touch-action: none;
    }
    
    /* 隱藏元素的通用類別 */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col items-center pb-6">

  <!-- 頂部標題 -->
  <header class="w-full bg-white shadow-sm p-2 text-center mb-2">
    <h1 class="text-xl font-extrabold text-blue-600">智慧去背小幫手</h1>
  </header>

  <main class="w-full max-w-2xl px-3 flex flex-col gap-3">
    
    <!-- 未上傳圖片時顯示的按鈕區塊 -->
    <div id="initial-upload-container" class="transition-all duration-300 block">
      <label class="bg-blue-600 text-white text-xl font-bold py-8 px-4 rounded-2xl shadow-md w-full flex flex-col items-center justify-center gap-3 cursor-pointer active:scale-95 transition-transform">
        <i data-lucide="upload" style="width: 48px; height: 48px;"></i>
        點擊讀入照片
        <input type="file" accept="image/*" class="hidden" id="upload-input-1" />
      </label>
    </div>

    <!-- 圖片預覽與編輯區 (預設隱藏) -->
    <div id="editor-container" class="flex flex-col gap-3 hidden">
      
      <!-- 模式切換標籤 -->
      <div class="flex bg-gray-200 rounded-xl p-1 shadow-inner">
        <button id="btn-mode-smart" class="flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-base font-bold transition-colors bg-white text-blue-600 shadow">
          <i data-lucide="wand-2" style="width: 18px; height: 18px;"></i> 智慧選色
        </button>
        <button id="btn-mode-manual" class="flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-base font-bold transition-colors text-gray-500">
          <i data-lucide="hand" style="width: 18px; height: 18px;"></i> 手動塗抹
        </button>
      </div>

      <!-- 提示文字 (移出畫布) -->
      <p id="status-hint" class="text-sm font-semibold text-center text-blue-600 m-0 flex items-center justify-center gap-1">
        <i data-lucide="mouse-pointer-2" id="hint-icon" style="width: 16px; height: 16px;"></i> 
        <span id="hint-text">請先點擊圖片選擇要去背的顏色</span>
      </p>

      <!-- 畫布顯示區 -->
      <div class="relative w-full rounded-xl overflow-hidden shadow-inner border-2 border-gray-200 bg-white">
        <div class="checkerboard w-full h-full flex justify-center items-center overflow-hidden">
          <canvas id="main-canvas" class="max-w-full h-auto cursor-crosshair transition-opacity" style="max-height: 65vh;"></canvas>
        </div>
      </div>

      <!-- 控制面板 -->
      <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-100 flex flex-col gap-4 w-full">
        
        <!-- 智慧模式控制項 -->
        <div id="smart-controls" class="flex flex-col gap-2 opacity-60">
          <div class="flex justify-between items-center">
            <label class="text-base font-bold text-gray-800">去背容忍值</label>
            <span id="tolerance-val-display" class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md">30%</span>
          </div>
          <input type="range" id="tolerance-slider" min="0" max="100" value="30" disabled class="w-full h-6 bg-gray-200 rounded-lg appearance-none cursor-not-allowed">
          <p id="smart-hint-text" class="text-xs text-orange-600 font-medium">
            請先在上方圖片點擊您想要去除的背景顏色，即可啟用容忍值調整。
          </p>
        </div>

        <!-- 手動模式控制項 (預設隱藏) -->
        <div id="manual-controls" class="flex flex-col gap-4 hidden">
          <div class="flex gap-2">
            <button id="btn-brush-erase" class="flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-red-400 bg-red-50 text-red-600">
              <i data-lucide="eraser" style="width: 24px; height: 24px;"></i>
              <span class="text-sm font-bold">橡皮擦 (去除)</span>
            </button>
            <button id="btn-brush-restore" class="flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-transparent bg-gray-100 text-gray-500">
              <i data-lucide="brush" style="width: 24px; height: 24px;"></i>
              <span class="text-sm font-bold">修復筆 (還原)</span>
            </button>
          </div>
          
          <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
              <label class="text-base font-bold text-gray-800">筆刷大小</label>
              <span id="brush-size-display" class="text-sm font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded-md">30px</span>
            </div>
            <input type="range" id="brush-size-slider" min="5" max="100" value="30" class="w-full h-6 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
          </div>
        </div>

        <!-- 共用操作按鈕群 -->
        <div class="grid grid-cols-2 gap-2 mt-1">
          <button id="btn-reset" class="flex items-center justify-center gap-1 bg-gray-100 text-gray-700 text-base font-bold py-2 rounded-xl active:scale-95 transition-transform">
            <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i> 重設全部
          </button>
          
          <button id="btn-save" class="flex items-center justify-center gap-1 bg-green-500 text-white text-base font-bold py-2 rounded-xl shadow-md active:scale-95 transition-transform">
            <i data-lucide="download" style="width: 18px; height: 18px;"></i> 存檔
          </button>
        </div>

        <label class="flex items-center justify-center gap-1 bg-blue-600 text-white text-base font-bold py-2 rounded-xl shadow-md active:scale-95 transition-transform cursor-pointer w-full">
          <i data-lucide="upload" style="width: 18px; height: 18px;"></i> 換一張照片
          <input type="file" accept="image/*" class="hidden" id="upload-input-2" />
        </label>

      </div>
    </div>

  </main>

  <script>
    // 初始化 Lucide 圖示
    lucide.createIcons();

    // 狀態變數
    let hasImage = false;
    let targetColor = null;
    let tolerance = 30;
    let appMode = 'smart'; // 'smart' 或 'manual'
    let brushMode = 'erase'; // 'erase' 或 'restore'
    let brushSize = 30;
    let isDrawing = false;
    let lastPos = null;

    // DOM 元素參考
    const initialContainer = document.getElementById('initial-upload-container');
    const editorContainer = document.getElementById('editor-container');
    const uploadInputs = [document.getElementById('upload-input-1'), document.getElementById('upload-input-2')];
    
    const mainCanvas = document.getElementById('main-canvas');
    const ctx = mainCanvas.getContext('2d');
    const originalCanvas = document.createElement('canvas'); // 隱藏備份畫布
    const origCtx = originalCanvas.getContext('2d');
    let originalImageData = null; // 用於智慧去背的原始像素
    let imageWidth = 0;
    let imageHeight = 0;

    // UI 控制元素
    const btnModeSmart = document.getElementById('btn-mode-smart');
    const btnModeManual = document.getElementById('btn-mode-manual');
    const smartControls = document.getElementById('smart-controls');
    const manualControls = document.getElementById('manual-controls');
    
    const toleranceSlider = document.getElementById('tolerance-slider');
    const toleranceValDisplay = document.getElementById('tolerance-val-display');
    const smartHintText = document.getElementById('smart-hint-text');

    const btnBrushErase = document.getElementById('btn-brush-erase');
    const btnBrushRestore = document.getElementById('btn-brush-restore');
    const brushSizeSlider = document.getElementById('brush-size-slider');
    const brushSizeDisplay = document.getElementById('brush-size-display');

    const btnReset = document.getElementById('btn-reset');
    const btnSave = document.getElementById('btn-save');

    const hintText = document.getElementById('hint-text');
    const hintIcon = document.getElementById('hint-icon');

    // ----------------------------------------------------------------
    // 核心邏輯區
    // ----------------------------------------------------------------

    // 顏色距離計算
    function colorDistance(r1, g1, b1, r2, g2, b2) {
      return Math.sqrt(Math.pow(r1 - r2, 2) + Math.pow(g1 - g2, 2) + Math.pow(b1 - b2, 2));
    }

    // 處理圖片上傳
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // 限制最大尺寸防崩潰
          const MAX_DIM = 1080;
          let w = img.width;
          let h = img.height;

          if (w > MAX_DIM || h > MAX_DIM) {
            const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
            w = Math.floor(w * ratio);
            h = Math.floor(h * ratio);
          }

          imageWidth = w;
          imageHeight = h;

          // 設定主 Canvas
          mainCanvas.width = w;
          mainCanvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          // 設定隱藏的備份 Canvas
          originalCanvas.width = w;
          originalCanvas.height = h;
          origCtx.drawImage(img, 0, 0, w, h);

          // 儲存原始像素
          originalImageData = ctx.getImageData(0, 0, w, h);

          // 重置狀態
          targetColor = null;
          tolerance = 30;
          toleranceSlider.value = 30;
          appMode = 'smart';
          hasImage = true;

          updateUI();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = ''; // 清除 input，允許重複選同一張圖
    }

    // 智慧去背處理
    function processSmartImage() {
      if (!originalImageData || !targetColor) return;
      
      const originalData = originalImageData.data;
      const newImgData = new ImageData(
        new Uint8ClampedArray(originalData),
        imageWidth,
        imageHeight
      );
      const data = newImgData.data;

      // 容忍值轉換 (0-100 映射到 0-441)
      const maxDist = 441.67; 
      const currentTol = (tolerance / 100) * maxDist;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        
        if (colorDistance(r, g, b, targetColor.r, targetColor.g, targetColor.b) <= currentTol) {
          data[i + 3] = 0; // 設為透明
        }
      }

      ctx.putImageData(newImgData, 0, 0);
    }

    // 取得相對於 Canvas 的坐標
    function getCoordinates(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // 繪製塗抹點
    function drawPoint(x, y) {
      if (brushMode === 'erase') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, brushSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      } else {
        // 還原模式
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, brushSize, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(originalCanvas, 0, 0);
        ctx.restore();
      }
    }

    // ----------------------------------------------------------------
    // 事件監聽區
    // ----------------------------------------------------------------

    uploadInputs.forEach(input => input.addEventListener('change', handleImageUpload));

    // Canvas 互動
    mainCanvas.addEventListener('pointerdown', (e) => {
      if (!originalImageData) return;

      if (appMode === 'smart') {
        // 智慧選色
        const { x, y } = getCoordinates(e);
        const data = originalImageData.data;
        const index = (Math.floor(y) * imageWidth + Math.floor(x)) * 4;
        
        if (index >= 0 && index < data.length) {
          targetColor = { r: data[index], g: data[index + 1], b: data[index + 2] };
          processSmartImage();
          updateUI();
        }
      } else {
        // 手動塗抹
        mainCanvas.setPointerCapture(e.pointerId);
        isDrawing = true;
        const { x, y } = getCoordinates(e);
        drawPoint(x, y);
        lastPos = { x, y };
      }
    });

    mainCanvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || appMode !== 'manual') return;

      const { x, y } = getCoordinates(e);
      
      if (lastPos) {
        const dx = x - lastPos.x;
        const dy = y - lastPos.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const steps = Math.max(Math.floor(distance / (brushSize / 4)), 1);

        for (let i = 0; i <= steps; i++) {
          const interpX = lastPos.x + (dx * i) / steps;
          const interpY = lastPos.y + (dy * i) / steps;
          drawPoint(interpX, interpY);
        }
      } else {
        drawPoint(x, y);
      }
      lastPos = { x, y };
    });

    const stopDrawing = (e) => {
      if (appMode === 'manual' && isDrawing) {
        isDrawing = false;
        lastPos = null;
        mainCanvas.releasePointerCapture(e.pointerId);
      }
    };

    mainCanvas.addEventListener('pointerup', stopDrawing);
    mainCanvas.addEventListener('pointercancel', stopDrawing);

    // 模式切換
    btnModeSmart.addEventListener('click', () => {
      appMode = 'smart';
      if (targetColor) processSmartImage(); // 切回智慧時重置為智慧去背結果
      updateUI();
    });

    btnModeManual.addEventListener('click', () => {
      appMode = 'manual';
      updateUI();
    });

    // 容忍值滑桿
    toleranceSlider.addEventListener('input', (e) => {
      tolerance = Number(e.target.value);
      toleranceValDisplay.innerText = `${tolerance}%`;
      if (targetColor) processSmartImage();
    });

    // 筆刷切換
    btnBrushErase.addEventListener('click', () => { brushMode = 'erase'; updateUI(); });
    btnBrushRestore.addEventListener('click', () => { brushMode = 'restore'; updateUI(); });

    // 筆刷大小
    brushSizeSlider.addEventListener('input', (e) => {
      brushSize = Number(e.target.value);
      brushSizeDisplay.innerText = `${brushSize}px`;
    });

    // 重設按鈕
    btnReset.addEventListener('click', () => {
      if (!originalImageData) return;
      ctx.putImageData(originalImageData, 0, 0);
      targetColor = null;
      tolerance = 0;
      toleranceSlider.value = 0;
      toleranceValDisplay.innerText = `0%`;
      appMode = 'smart';
      updateUI();
    });

    // 存檔按鈕
    btnSave.addEventListener('click', () => {
      const dataUrl = mainCanvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = '去背完成圖片.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // ----------------------------------------------------------------
    // 介面更新邏輯
    // ----------------------------------------------------------------
    function updateUI() {
      // 顯示/隱藏 主視窗
      if (hasImage) {
        initialContainer.classList.add('hidden');
        editorContainer.classList.remove('hidden');
      } else {
        initialContainer.classList.remove('hidden');
        editorContainer.classList.add('hidden');
      }

      // 更新模式頁籤外觀
      if (appMode === 'smart') {
        btnModeSmart.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-base font-bold transition-colors bg-white text-blue-600 shadow";
        btnModeManual.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-base font-bold transition-colors text-gray-500";
        smartControls.classList.remove('hidden');
        manualControls.classList.add('hidden');
        mainCanvas.classList.remove('cursor-pointer');
        mainCanvas.classList.add('cursor-crosshair');
        
        // 遮罩提示
        hintIcon.setAttribute('data-lucide', 'mouse-pointer-2');
        hintText.innerText = targetColor ? '點擊圖片重新選擇背景色' : '請先點擊圖片選擇要去背的顏色';
        
        // 容忍值狀態
        if (targetColor) {
          smartControls.classList.remove('opacity-60');
          toleranceSlider.disabled = false;
          toleranceSlider.classList.remove('cursor-not-allowed');
          toleranceSlider.classList.add('cursor-pointer', 'accent-blue-600');
          smartHintText.innerText = '提示：調整此數值會重置「手動塗抹」的結果。建議先決定好容忍值，再切換到手動塗抹。';
        } else {
          smartControls.classList.add('opacity-60');
          toleranceSlider.disabled = true;
          toleranceSlider.classList.add('cursor-not-allowed');
          toleranceSlider.classList.remove('cursor-pointer', 'accent-blue-600');
          smartHintText.innerText = '請先在上方圖片點擊您想要去除的背景顏色，即可啟用容忍值調整。';
        }

      } else {
        // Manual mode
        btnModeSmart.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-base font-bold transition-colors text-gray-500";
        btnModeManual.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-base font-bold transition-colors bg-white text-purple-600 shadow";
        smartControls.classList.add('hidden');
        manualControls.classList.remove('hidden');
        mainCanvas.classList.add('cursor-pointer');
        mainCanvas.classList.remove('cursor-crosshair');
        
        // 遮罩提示
        hintIcon.setAttribute('data-lucide', 'brush');
        hintText.innerText = '直接在圖片上滑動手指塗抹';

        // 筆刷按鈕狀態
        if (brushMode === 'erase') {
          btnBrushErase.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-red-400 bg-red-50 text-red-600";
          btnBrushRestore.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-transparent bg-gray-100 text-gray-500";
        } else {
          btnBrushErase.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-transparent bg-gray-100 text-gray-500";
          btnBrushRestore.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-green-400 bg-green-50 text-green-600";
        }
      }
      
      // 重新渲染 icon 確保正確顯示
      lucide.createIcons();
    }

  </script>
</body>
</html>
