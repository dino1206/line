function rgb2xyz(r, g, b) {
r = r / 255; g = g / 255; b = b / 255;
r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
r *= 100; g *= 100; b *= 100;
return {
x: r * 0.4124564 + g * 0.3575761 + b * 0.1804375,
y: r * 0.2126729 + g * 0.7151522 + b * 0.0721750,
z: r * 0.0193339 + g * 0.1191920 + b * 0.9503041
};
}

function xyz2lab(x, y, z) {
const refX = 95.047, refY = 100.000, refZ = 108.883;
x = x / refX; y = y / refY; z = z / refZ;
x = x > 0.008856 ? Math.pow(x, 1/3) : (7.787 * x) + (16 / 116);
y = y > 0.008856 ? Math.pow(y, 1/3) : (7.787 * y) + (16 / 116);
z = z > 0.008856 ? Math.pow(z, 1/3) : (7.787 * z) + (16 / 116);
return {
L: (116 * y) - 16,
a: 500 * (x - y),
b: 200 * (y - z)
};
}

function rgb2lab(r, g, b) {
const xyz = rgb2xyz(r, g, b);
return xyz2lab(xyz.x, xyz.y, xyz.z);
}

function deltaE2000(lab1, lab2) {
const { L: L1, a: a1, b: b1 } = lab1;
const { L: L2, a: a2, b: b2 } = lab2;

const kL = 1, kC = 1, kH = 1;
const C1 = Math.sqrt(a1 * a1 + b1 * b1);
const C2 = Math.sqrt(a2 * a2 + b2 * b2);
const Cb = (C1 + C2) / 2;
const G = 0.5 * (1 - Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + Math.pow(25, 7))));
const a1p = a1 * (1 + G);
const a2p = a2 * (1 + G);
const C1p = Math.sqrt(a1p * a1p + b1 * b1);
const C2p = Math.sqrt(a2p * a2p + b2 * b2);
const h1p = Math.atan2(b1, a1p) * (180 / Math.PI);
const h1pAdj = h1p < 0 ? h1p + 360 : h1p;
const h2p = Math.atan2(b2, a2p) * (180 / Math.PI);
const h2pAdj = h2p < 0 ? h2p + 360 : h2p;
const dLp = L2 - L1;
const dCp = C2p - C1p;
let dhp = h2pAdj - h1pAdj;
if (dhp > 180) dhp -= 360;
else if (dhp < -180) dhp += 360;
const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin((dhp * Math.PI) / 360);
const Lb = (L1 + L2) / 2;
const Cb1p = C1p, Cb2p = C2p;
const Cbpb = (Cb1p + Cb2p) / 2;
const LbSqr = Lb * Lb;
const CbpbSqr = Cbpb * Cbpb;
const SL = 1 + (0.015 * CbpbSqr) / Math.sqrt(20 + CbpbSqr);
const SC = 1 + 0.045 * Cbpb;
const SH = 1 + 0.015 * Cbpb * (1 - 0.17 * Math.cos(((h1pAdj - 30) * Math.PI) / 180) + 0.24 * Math.cos((2 * h1pAdj * Math.PI) / 180) + 0.32 * Math.cos(((3 * h1pAdj + 6) * Math.PI) / 180) - 0.20 * Math.cos(((4 * h1pAdj - 63) * Math.PI) / 180));
const dTheta = 30 * Math.exp(-Math.pow((h1pAdj - 275) / 25, 2));
const RT = -2 * Math.sqrt(Math.pow(Cbpb, 7) / (Math.pow(Cbpb, 7) + Math.pow(25, 7))) * Math.sin((2 * dTheta * Math.PI) / 180);
const dE = Math.sqrt(Math.pow(dLp / (kL * SL), 2) + Math.pow(dCp / (kC * SC), 2) + Math.pow(dHp / (kH * SH), 2) + RT * (dCp / (kC * SC)) * (dHp / (kH * SH)));
return dE;
}

function colorDistance(r1, g1, b1, r2, g2, b2) {
const lab1 = rgb2lab(r1, g1, b1);
const lab2 = rgb2lab(r2, g2, b2);
return deltaE2000(lab1, lab2);
}

function saveState() {
if (historyIndex < history.length - 1) {
history = history.slice(0, historyIndex + 1);
}
history.push({
imageData: ctx.getImageData(0, 0, imageWidth, imageHeight),
preClickImageData: currentBaseImageData ? new ImageData(new Uint8ClampedArray(currentBaseImageData.data), imageWidth, imageHeight) : null,
activeClick: activeClick ? { ...activeClick } : null,
smartFillMode: smartFillMode,
toleranceValue: toleranceValue,
featherRadius: featherRadius
});
if (history.length > MAX_HISTORY) {
history.shift();
} else {
historyIndex++;
}
updateUndoRedoUI();
}

function applyState(state) {
ctx.putImageData(state.imageData, 0, 0);
activeClick = state.activeClick ? { ...state.activeClick } : null;
currentBaseImageData = state.preClickImageData ? new ImageData(new Uint8ClampedArray(state.preClickImageData.data), imageWidth, imageHeight) : null;
smartFillMode = state.smartFillMode || 'contiguous';
toleranceValue = state.toleranceValue || 30;
featherRadius = state.featherRadius || 3;
updateUI();
updateUndoRedoUI();
}

function loadScript(src, fallbackSrc) {
return new Promise((resolve, reject) => {
if (document.querySelector(`script[src="${src}"]`) || document.querySelector(`script[src="${fallbackSrc}"]`)) {
resolve();
return;
}
const script = document.createElement('script');
script.src = src;
script.crossOrigin = "anonymous";
script.onload = resolve;
script.onerror = () => {
if (fallbackSrc) {
const fbScript = document.createElement('script');
fbScript.src = fallbackSrc;
fbScript.crossOrigin = "anonymous";
fbScript.onload = resolve;
fbScript.onerror = () => reject(new Error(`兩次嘗試皆無法載入腳本: ${fallbackSrc}`));
document.head.appendChild(fbScript);
} else {
reject(new Error(`無法載入腳本: ${src}`));
}
};
document.head.appendChild(script);
});
}

async function runAI() {
if (currentAiEngine === 'imgly') {
await runAIImgly();
} else {
await runAIMediaPipe();
}
}

async function runAIImgly() {
if (isAiProcessing || !hasImage) return;
isAiProcessing = true;
btnRunAi.classList.add('hidden');
aiLoading.classList.remove('hidden');
try {
aiStatusText.innerText = "初始化高精度 AI...";
let removeBackground;
try {
const module = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
removeBackground = module.removeBackground;
} catch (e) {
const module = await import('https://esm.sh/@imgly/background-removal@1.5.5');
removeBackground = module.removeBackground;
}
aiStatusText.innerText = "準備分析圖片...";
const imageBlob = await new Promise(resolve => originalCanvas.toBlob(resolve, 'image/png'));
const blob = await removeBackground(imageBlob, {
progress: (key, current, total) => {
if (total) {
const pct = Math.round((current / total) * 100);
aiStatusText.innerText = `下載模型 / 處理中... ${pct}%`;
} else {
aiStatusText.innerText = `正在精細扣圖中...`;
}
}
});
const url = URL.createObjectURL(blob);
const img = new Image();
img.onload = () => {
ctx.clearRect(0, 0, imageWidth, imageHeight);
ctx.drawImage(img, 0, 0, imageWidth, imageHeight);
saveState();
URL.revokeObjectURL(url);
isAiProcessing = false;
btnRunAi.classList.remove('hidden');
aiLoading.classList.add('hidden');
};
img.src = url;
} catch (err) {
alert('高精度 AI 模型載入失敗。這可能是網路問題。');
isAiProcessing = false;
btnRunAi.classList.remove('hidden');
aiLoading.classList.add('hidden');
}
}

async function runAIMediaPipe() {
if (isAiProcessing || !hasImage) return;
isAiProcessing = true;
btnRunAi.classList.add('hidden');
aiLoading.classList.remove('hidden');
try {
aiStatusText.innerText = "載入 MediaPipe 引擎...";
if (!window.SelfieSegmentation) {
await loadScript(
'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js',
'https://unpkg.com/@mediapipe/selfie_segmentation/selfie_segmentation.js'
);
}
aiStatusText.innerText = "正在極速辨識人像邊緣...";
await new Promise((resolve, reject) => {
const selfieSegmentation = new window.SelfieSegmentation({
locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
});
selfieSegmentation.setOptions({
modelSelection: 1,
});
selfieSegmentation.onResults((results) => {
try {
const maskCanvas = document.createElement('canvas');
maskCanvas.width = imageWidth;
maskCanvas.height = imageHeight;
const maskCtx = maskCanvas.getContext('2d');
maskCtx.drawImage(results.segmentationMask, 0, 0, imageWidth, imageHeight);
const maskData = maskCtx.getImageData(0, 0, imageWidth, imageHeight).data;
const currentData = ctx.getImageData(0, 0, imageWidth, imageHeight);
for (let i = 0; i < maskData.length; i += 4) {
currentData.data[i + 3] = Math.min(currentData.data[i + 3], maskData[i]);
}
ctx.putImageData(currentData, 0, 0);
saveState();
resolve();
} catch (e) {
reject(e);
}
});
selfieSegmentation.send({image: originalCanvas}).catch(reject);
});
} catch (err) {
alert('MediaPipe 模型載入失敗。請檢查網路。');
} finally {
isAiProcessing = false;
btnRunAi.classList.remove('hidden');
aiLoading.classList.add('hidden');
}
}

function handleImageUpload(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (event) => {
const img = new Image();
img.onload = () => {
const MAX_DIM = 1080;
let w = img.width;
let h = img.height;
if (w > MAX_DIM || h > MAX_DIM) {
const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
w = Math.floor(w * ratio);
h = Math.floor(h * ratio);
}
imageWidth = w;
imageHeight = h;
mainCanvas.width = w;
mainCanvas.height = h;
ctx.drawImage(img, 0, 0, w, h);
originalCanvas.width = w;
originalCanvas.height = h;
origCtx.drawImage(img, 0, 0, w, h);
originalImageData = ctx.getImageData(0, 0, w, h);
activeClick = null;
currentBaseImageData = null;
smartFillMode = 'contiguous';
toleranceValue = 30;
featherRadius = 3;
appMode = 'smart';
hasImage = true;
history = [];
historyIndex = -1;
updateUI();
saveState();
};
img.onerror = () => {
alert('無法讀取圖片，請確認檔案格式是否正確。');
};
img.src = event.target.result;
};
reader.readAsDataURL(file);
e.target.value = '';
}

function processSmartImage() {
if (!currentBaseImageData || !activeClick) return;
const { x: startX, y: startY } = activeClick;
const originalData = currentBaseImageData.data;
const newImgData = new ImageData(
new Uint8ClampedArray(originalData),
imageWidth,
imageHeight
);
const data = newImgData.data;
const startIndex = (startY * imageWidth + startX) * 4;
const targetR = originalData[startIndex];
const targetG = originalData[startIndex + 1];
const targetB = originalData[startIndex + 2];
const targetA = originalData[startIndex + 3];

if (targetA === 0) {
ctx.putImageData(newImgData, 0, 0);
return;
}

const maxDist = 100;
const currentTol = (toleranceValue / 100) * maxDist;

if (smartFillMode === 'global') {
for (let i = 0; i < data.length; i += 4) {
const r = data[i];
const g = data[i + 1];
const b = data[i + 2];
if (data[i + 3] > 0 && colorDistance(r, g, b, targetR, targetG, targetB) <= currentTol) {
data[i + 3] = 0;
}
}
} else {
const visited = new Float32Array(imageWidth * imageHeight);
const edgeDist = new Float32Array(imageWidth * imageHeight);
const fillQueue = [];
fillQueue.push({ x: startX, y: startY, dist: 0 });
visited[startY * imageWidth + startX] = 1;

const filledPixels = [];

while (fillQueue.length > 0) {
const { x, y, dist } = fillQueue.shift();
const idx = (y * imageWidth + x) * 4;

if (data[idx + 3] > 0) {
const r = data[idx];
const g = data[idx + 1];
const b = data[idx + 2];

if (colorDistance(r, g, b, targetR, targetG, targetB) <= currentTol) {
filledPixels.push({ x, y });
edgeDist[y * imageWidth + x] = dist;

let isEdge = false;
const neighbors = [
[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]
];
for (const [nx, ny] of neighbors) {
if (nx >= 0 && nx < imageWidth && ny >= 0 && ny < imageHeight) {
const nIdx = (ny * imageWidth + nx) * 4;
if (data[nIdx + 3] > 0) {
const nr = data[nIdx], ng = data[nIdx + 1], nb = data[nIdx + 2];
if (colorDistance(nr, ng, nb, targetR, targetG, targetB) > currentTol) {
isEdge = true;
break;
}
}
}
}
data[idx + 3] = isEdge && featherRadius > 0 ? 0 : 0;

const newDist = dist + 1;
const checkAndPush = (nx, ny) => {
if (nx >= 0 && nx < imageWidth && ny >= 0 && ny < imageHeight) {
const nIdx = ny * imageWidth + nx;
if (!visited[nIdx]) {
visited[nIdx] = 1;
const pxIdx = nIdx * 4;
if (data[pxIdx + 3] > 0) {
const nr = data[pxIdx], ng = data[pxIdx + 1], nb = data[pxIdx + 2];
if (colorDistance(nr, ng, nb, targetR, targetG, targetB) <= currentTol) {
fillQueue.push({ x: nx, y: ny, dist: newDist });
}
}
}
}
};
checkAndPush(x + 1, y);
checkAndPush(x - 1, y);
checkAndPush(x, y + 1);
checkAndPush(x, y - 1);
}
}
}

if (featherRadius > 0) {
for (const pixel of filledPixels) {
const { x, y } = pixel;
const idx = (y * imageWidth + x) * 4;
let isEdgePixel = false;
let minDistToBg = Infinity;

const neighbors = [
[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]
];
for (const [nx, ny] of neighbors) {
if (nx >= 0 && nx < imageWidth && ny >= 0 && ny < imageHeight) {
const nIdx = (ny * imageWidth + nx) * 4;
if (data[nIdx + 3] === 0 || data[nIdx + 3] === undefined) {
isEdgePixel = true;
break;
}
const nr = data[nIdx], ng = data[nIdx + 1], nb = data[nIdx + 2];
if (colorDistance(nr, ng, nb, targetR, targetG, targetB) > currentTol) {
const dist = edgeDist[y * imageWidth + x];
if (dist < minDistToBg) minDistToBg = dist;
}
}
}

if (isEdgePixel) {
const dist = edgeDist[y * imageWidth + x] || 0;
let alpha = 0;
if (dist <= featherRadius) {
alpha = Math.floor(255 * (dist / featherRadius));
} else {
alpha = 255;
}
data[idx + 3] = Math.max(0, Math.min(255, alpha));
}
}
}
}

ctx.putImageData(newImgData, 0, 0);
}

function getCoordinates(e) {
const rect = mainCanvas.getBoundingClientRect();
const scaleX = mainCanvas.width / rect.width;
const scaleY = mainCanvas.height / rect.height;
const clientX = e.clientX || (e.touches && e.touches[0].clientX);
const clientY = e.clientY || (e.touches && e.touches[0].clientY);
return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function drawPoint(x, y) {
if (brushMode === 'erase') {
ctx.globalCompositeOperation = 'destination-out';
ctx.beginPath();
ctx.arc(x, y, brushSize, 0, Math.PI * 2);
ctx.fill();
ctx.globalCompositeOperation = 'source-over';
} else {
ctx.save();
ctx.beginPath();
ctx.arc(x, y, brushSize, 0, Math.PI * 2);
ctx.clip();
ctx.drawImage(originalCanvas, 0, 0);
ctx.restore();
}
}

function updateBrushCursor(e) {
if (appMode !== 'manual' || !hasImage) {
brushCursor.classList.add('hidden');
return;
}
brushCursor.classList.remove('hidden');
const rect = mainCanvas.getBoundingClientRect();
const scaleX = mainCanvas.width / rect.width;
const cssSize = (brushSize * 2) / scaleX;
brushCursor.style.width = `${cssSize}px`;
brushCursor.style.height = `${cssSize}px`;
const clientX = e.clientX || (e.touches && e.touches[0].clientX);
const clientY = e.clientY || (e.touches && e.touches[0].clientY);
brushCursor.style.left = `${clientX}px`;
brushCursor.style.top = `${clientY}px`;
}

uploadInputs.forEach(input => input.addEventListener('change', handleImageUpload));

toleranceSlider.addEventListener('input', (e) => {
toleranceValue = Number(e.target.value);
toleranceDisplay.innerText = toleranceValue;
});

featherSlider.addEventListener('input', (e) => {
featherRadius = Number(e.target.value);
featherDisplay.innerText = `${featherRadius}px`;
});

btnUndo.addEventListener('click', () => {
if (historyIndex > 0) {
historyIndex--;
applyState(history[historyIndex]);
}
});
btnRedo.addEventListener('click', () => {
if (historyIndex < history.length - 1) {
historyIndex++;
applyState(history[historyIndex]);
}
});

btnRunAi.addEventListener('click', runAI);

btnEngineImgly.addEventListener('click', () => {
currentAiEngine = 'imgly';
btnEngineImgly.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-purple-400 bg-white text-purple-600 text-sm";
btnEngineMediapipe.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-transparent bg-white/50 text-gray-500 text-sm hover:bg-white";
aiEngineHint.innerText = "適合：全身照、複雜背景、商品 (首次需下載約40MB模型)";
runAiText.innerText = "啟動高精度去背";
});
btnEngineMediapipe.addEventListener('click', () => {
currentAiEngine = 'mediapipe';
btnEngineMediapipe.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-purple-400 bg-white text-purple-600 text-sm";
btnEngineImgly.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-transparent bg-white/50 text-gray-500 text-sm hover:bg-white";
aiEngineHint.innerText = "適合：半身照、視訊大頭貼 (瞬間完成，邊緣極度平滑)";
runAiText.innerText = "啟動 MediaPipe 去背";
});

mainCanvas.addEventListener('pointerenter', updateBrushCursor);
mainCanvas.addEventListener('pointerleave', () => brushCursor.classList.add('hidden'));

mainCanvas.addEventListener('click', (e) => {
if (!originalImageData || appMode !== 'smart') return;
const { x, y } = getCoordinates(e);
const ix = Math.floor(x);
const iy = Math.floor(y);
const data = ctx.getImageData(0, 0, imageWidth, imageHeight).data;
const idx = (iy * imageWidth + ix) * 4;
if (idx >= 0 && idx < data.length && data[idx + 3] > 0) {
currentBaseImageData = ctx.getImageData(0, 0, imageWidth, imageHeight);
activeClick = { x: ix, y: iy };
processSmartImage();
saveState();
updateUI();
}
});

mainCanvas.addEventListener('pointerdown', (e) => {
if (!originalImageData || appMode !== 'manual') return;
mainCanvas.setPointerCapture(e.pointerId);
isDrawing = true;
const { x, y } = getCoordinates(e);
drawPoint(x, y);
lastPos = { x, y };
updateBrushCursor(e);
});
mainCanvas.addEventListener('pointermove', (e) => {
if (appMode === 'manual') {
updateBrushCursor(e);
}
if (!isDrawing || appMode !== 'manual') return;
const { x, y } = getCoordinates(e);
if (lastPos) {
const dx = x - lastPos.x;
const dy = y - lastPos.y;
const distance = Math.sqrt(dx * dx + dy * dy);
const steps = Math.max(Math.floor(distance / (brushSize / 4)), 1);
for (let i = 0; i <= steps; i++) {
const interpX = lastPos.x + (dx * i) / steps;
const interpY = lastPos.y + (dy * i) / steps;
drawPoint(interpX, interpY);
}
} else {
drawPoint(x, y);
}
lastPos = { x, y };
});

const stopDrawing = (e) => {
if (appMode === 'manual' && isDrawing) {
isDrawing = false;
lastPos = null;
mainCanvas.releasePointerCapture(e.pointerId);
saveState();
}
};
mainCanvas.addEventListener('pointerup', stopDrawing);
mainCanvas.addEventListener('pointercancel', stopDrawing);

btnModeSmart.addEventListener('click', () => {
appMode = 'smart';
updateUI();
brushCursor.classList.add('hidden');
});
btnModeAi.addEventListener('click', () => {
appMode = 'ai';
updateUI();
brushCursor.classList.add('hidden');
});
btnModeManual.addEventListener('click', () => {
appMode = 'manual';
updateUI();
});

btnFillContiguous.addEventListener('click', () => {
smartFillMode = 'contiguous';
updateUI();
if (activeClick && currentBaseImageData) {
processSmartImage();
if (history.length > 0) history[historyIndex].imageData = ctx.getImageData(0, 0, imageWidth, imageHeight);
}
});
btnFillGlobal.addEventListener('click', () => {
smartFillMode = 'global';
updateUI();
if (activeClick && currentBaseImageData) {
processSmartImage();
if (history.length > 0) history[historyIndex].imageData = ctx.getImageData(0, 0, imageWidth, imageHeight);
}
});

btnBrushErase.addEventListener('click', () => {
brushMode = 'erase';
updateUI();
});
btnBrushRestore.addEventListener('click', () => {
brushMode = 'restore';
updateUI();
});

brushSizeSlider.addEventListener('input', (e) => {
brushSize = Number(e.target.value);
brushSizeDisplay.innerText = `${brushSize}px`;
});

btnReset.addEventListener('click', () => {
if (!originalImageData) return;
ctx.putImageData(originalImageData, 0, 0);
activeClick = null;
currentBaseImageData = null;
smartFillMode = 'contiguous';
toleranceValue = 30;
featherRadius = 3;
appMode = 'smart';
toleranceSlider.value = 30;
toleranceDisplay.innerText = '30';
featherSlider.value = 3;
featherDisplay.innerText = '3px';
updateUI();
saveState();
});

btnSave.addEventListener('click', () => {
const dataUrl = mainCanvas.toDataURL('image/png');
const a = document.createElement('a');
a.href = dataUrl;
a.download = '去背完成圖片.png';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
});

function updateUndoRedoUI() {
btnUndo.disabled = historyIndex <= 0;
btnRedo.disabled = historyIndex >= history.length - 1;
btnUndo.classList.toggle('text-blue-600', historyIndex > 0);
btnRedo.classList.toggle('text-blue-600', historyIndex < history.length - 1);
}

function updateUI() {
if (hasImage) {
initialContainer.classList.add('hidden');
editorContainer.classList.remove('hidden');
} else {
initialContainer.classList.remove('hidden');
editorContainer.classList.add('hidden');
}

btnModeSmart.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500";
btnModeAi.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500";
btnModeManual.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500";
smartControls.classList.add('hidden');
aiControls.classList.add('hidden');
manualControls.classList.add('hidden');

if (appMode === 'smart') {
btnModeSmart.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-blue-600 shadow";
smartControls.classList.remove('hidden');
mainCanvas.classList.remove('cursor-none');
mainCanvas.classList.add('cursor-crosshair');
mainCanvas.classList.remove('touch-none');
hintIcon.setAttribute('data-lucide', 'mouse-pointer-2');
hintText.innerText = activeClick ? '繼續點擊圖片中想去除的背景' : '請點擊圖片選擇要去背的背景顏色';
if (smartFillMode === 'contiguous') {
btnFillContiguous.className = "flex-1 py-2 rounded-xl border-2 font-bold transition-all border-blue-400 bg-blue-50 text-blue-600";
btnFillGlobal.className = "flex-1 py-2 rounded-xl border-2 font-bold transition-all border-transparent bg-gray-100 text-gray-500";
} else {
btnFillContiguous.className = "flex-1 py-2 rounded-xl border-2 font-bold transition-all border-transparent bg-gray-100 text-gray-500";
btnFillGlobal.className = "flex-1 py-2 rounded-xl border-2 font-bold transition-all border-blue-400 bg-blue-50 text-blue-600";
}
} else if (appMode === 'ai') {
btnModeAi.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-purple-600 shadow";
aiControls.classList.remove('hidden');
mainCanvas.classList.remove('cursor-none', 'cursor-crosshair');
mainCanvas.classList.remove('touch-none');
hintIcon.setAttribute('data-lucide', 'sparkles');
hintText.innerText = '選擇下方 AI 引擎並開始辨識';
} else {
btnModeManual.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-red-600 shadow";
manualControls.classList.remove('hidden');
mainCanvas.classList.add('cursor-none');
mainCanvas.classList.remove('cursor-crosshair');
mainCanvas.classList.add('touch-none');
hintIcon.setAttribute('data-lucide', 'brush');
hintText.innerText = '使用筆刷塗抹來去除或還原';
if (brushMode === 'erase') {
btnBrushErase.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-red-400 bg-red-50 text-red-600";
btnBrushRestore.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-transparent bg-gray-100 text-gray-500";
} else {
btnBrushErase.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-transparent bg-gray-100 text-gray-500";
btnBrushRestore.className = "flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-green-400 bg-green-50 text-green-600";
}
}
if (typeof lucide !== 'undefined') {
lucide.createIcons();
}
}
</script>
