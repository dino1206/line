<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧去背小幫手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .checkerboard {
      background-image: 
        linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
        linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
        linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: white;
    }
    .hidden { display: none !important; }
    
    /* 精修強度滑桿樣式 */
    input[type=range].refine-slider {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #8b5cf6, #06b6d4);
      outline: none;
    }
    input[type=range].refine-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      border: 2px solid #8b5cf6;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col items-center pb-6">

  <div id="brush-cursor" class="pointer-events-none fixed rounded-full border-2 border-gray-800 bg-white/40 hidden" style="z-index: 100; transform: translate(-50%, -50%);"></div>

  <header class="w-full bg-white shadow-sm p-2 text-center mb-2">
    <h1 class="text-xl font-extrabold text-blue-600">智慧去背小幫手</h1>
  </header>

  <main class="w-full max-w-2xl px-3 flex flex-col gap-3">
    
    <div id="initial-upload-container" class="transition-all duration-300 block">
      <label class="bg-blue-600 text-white text-xl font-bold py-8 px-4 rounded-2xl shadow-md w-full flex flex-col items-center justify-center gap-3 cursor-pointer active:scale-95 transition-transform">
        <i data-lucide="upload" style="width: 48px; height: 48px;"></i>
        點擊讀入照片
        <input type="file" accept="image/*" class="hidden" id="upload-input-1" />
      </label>
    </div>

    <div id="editor-container" class="flex flex-col gap-3 hidden">
      
      <!-- 模式切換 + 復原重做 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex bg-gray-200 rounded-xl p-1 shadow-inner flex-1 overflow-hidden">
          <button id="btn-mode-smart" class="flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-blue-600 shadow">
            <i data-lucide="wand-2" style="width: 16px; height: 16px;"></i> 魔術棒
          </button>
          <button id="btn-mode-ai" class="flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500">
            <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i> AI引擎
          </button>
          <button id="btn-mode-manual" class="flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500">
            <i data-lucide="hand" style="width: 16px; height: 16px;"></i> 塗抹
          </button>
        </div>
        <div class="flex bg-gray-200 rounded-xl p-1 shadow-inner shrink-0">
          <button id="btn-undo" class="p-2 rounded-lg text-gray-500 hover:bg-white hover:shadow transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>
            <i data-lucide="undo" style="width: 20px; height: 20px;"></i>
          </button>
          <button id="btn-redo" class="p-2 rounded-lg text-gray-500 hover:bg-white hover:shadow transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>
            <i data-lucide="redo" style="width: 20px; height: 20px;"></i>
          </button>
        </div>
      </div>

      <!-- 提示文字 -->
      <p id="status-hint" class="text-sm font-semibold text-center text-blue-600 m-0 flex items-center justify-center gap-1">
        <i data-lucide="mouse-pointer-2" id="hint-icon" style="width: 16px; height: 16px;"></i> 
        <span id="hint-text">請先點擊圖片選擇要去背的顏色</span>
      </p>

      <!-- 畫布 -->
      <div class="relative w-full rounded-xl overflow-hidden shadow-inner border-2 border-gray-200 bg-white">
        <div class="checkerboard w-full h-full flex justify-center items-center overflow-hidden">
          <canvas id="main-canvas" class="max-w-full h-auto cursor-crosshair transition-opacity" style="max-height: 60vh;"></canvas>
        </div>
      </div>

      <!-- 控制面板 -->
      <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-100 flex flex-col gap-4 w-full">
        
        <!-- 魔術棒控制 -->
        <div id="smart-controls" class="flex flex-col gap-3">
          <label class="text-base font-bold text-gray-800">去背範圍</label>
          <div class="flex gap-2">
            <button id="btn-fill-contiguous" class="flex-1 py-2 rounded-xl border-2 font-bold transition-all border-blue-400 bg-blue-50 text-blue-600">相鄰區域</button>
            <button id="btn-fill-global" class="flex-1 py-2 rounded-xl border-2 font-bold transition-all border-transparent bg-gray-100 text-gray-500">全圖相似色</button>
          </div>
          <p class="text-xs text-gray-500 font-medium">提示：在圖片上滑動可捲動網頁，單點擊才會去背。</p>
        </div>

        <!-- AI 引擎控制 -->
        <div id="ai-controls" class="flex flex-col gap-4 hidden">
          
          <!-- 引擎選擇 -->
          <div class="bg-purple-50 p-3 rounded-xl border border-purple-100 flex flex-col gap-2">
            <label class="text-sm font-bold text-purple-800">選擇 AI 引擎：</label>
            <div class="flex gap-2">
              <button id="btn-engine-imgly" class="flex-1 py-2 rounded-lg border-2 font-bold transition-all border-purple-400 bg-white text-purple-600 text-sm">
                ⭐ 全身照 (RMBG)
              </button>
              <button id="btn-engine-mediapipe" class="flex-1 py-2 rounded-lg border-2 font-bold transition-all border-transparent bg-white/50 text-gray-500 text-sm hover:bg-white">
                高速人像 (MediaPipe)
              </button>
            </div>
            <p id="ai-engine-hint" class="text-xs text-purple-600 mt-1">
              ⭐ 推薦：全身照、複雜背景、衣物邊緣，精準度最高 (首次下載約 40MB)
            </p>
          </div>

          <!-- ✨ 邊緣精修控制 -->
          <div class="bg-gradient-to-r from-violet-50 to-cyan-50 p-3 rounded-xl border border-violet-100 flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <label class="text-sm font-bold text-violet-800 flex items-center gap-1">
                <i data-lucide="scan-line" style="width: 14px; height: 14px;"></i>
                邊緣精修強度
              </label>
              <span id="refine-value-display" class="text-xs font-bold text-violet-700 bg-white px-2 py-0.5 rounded-md border border-violet-200">標準</span>
            </div>
            <input type="range" id="refine-slider" min="0" max="4" value="2" step="1" class="w-full refine-slider">
            <div class="flex justify-between text-xs text-gray-400 font-medium px-0.5">
              <span>關閉</span><span>輕微</span><span>標準</span><span>強力</span><span>極致</span>
            </div>
            <p id="refine-hint" class="text-xs text-violet-600">
              ✦ 標準：平衡去背乾淨與細節保留，適合大多數人像
            </p>

            <!-- 髮絲保留模式 -->
            <div class="flex items-center justify-between pt-1 border-t border-violet-100">
              <div>
                <p class="text-sm font-bold text-violet-800">髮絲細節保留</p>
                <p class="text-xs text-gray-500">Alpha matting 技術，保留細碎髮絲邊緣</p>
              </div>
              <button id="btn-hair-mode" class="relative w-12 h-6 rounded-full transition-colors duration-200 bg-gray-300 focus:outline-none shrink-0" role="switch" aria-checked="false">
                <span id="hair-toggle-knob" class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-200"></span>
              </button>
            </div>

            <!-- ✨ 新增：二次精修按鈕（去背後再次針對殘留邊緣處理） -->
            <div class="flex items-center justify-between pt-1 border-t border-violet-100">
              <div>
                <p class="text-sm font-bold text-violet-800">邊緣二次精修</p>
                <p class="text-xs text-gray-500">去背後手動再執行一次，清除殘留背景色</p>
              </div>
              <button id="btn-rerefine" class="shrink-0 px-3 py-1.5 rounded-lg bg-violet-100 text-violet-700 text-xs font-bold border border-violet-200 active:scale-95 transition-transform disabled:opacity-40" disabled>
                再次精修
              </button>
            </div>
          </div>

          <button id="btn-run-ai" class="flex items-center justify-center gap-2 bg-gradient-to-r from-purple-500 to-indigo-600 text-white text-lg font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform">
            <i data-lucide="sparkles"></i> <span id="run-ai-text">啟動高精度去背</span>
          </button>

          <div id="ai-loading" class="hidden flex-col items-center justify-center gap-2 py-2">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600"></div>
            <span class="text-sm text-purple-600 font-bold" id="ai-status-text">載入模型中...</span>
          </div>
        </div>

        <!-- 手動塗抹控制 -->
        <div id="manual-controls" class="flex flex-col gap-4 hidden">
          <p class="text-xs text-red-500 font-medium text-center mb-[-5px]">
            目前已鎖定防滑動，可直接在圖上塗抹。
          </p>
          <div class="flex gap-2">
            <button id="btn-brush-erase" class="flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-red-400 bg-red-50 text-red-600">
              <i data-lucide="eraser" style="width: 24px; height: 24px;"></i>
              <span class="text-sm font-bold">橡皮擦 (去除)</span>
            </button>
            <button id="btn-brush-restore" class="flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all border-transparent bg-gray-100 text-gray-500">
              <i data-lucide="brush" style="width: 24px; height: 24px;"></i>
              <span class="text-sm font-bold">修復筆 (還原)</span>
            </button>
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
              <label class="text-base font-bold text-gray-800">筆刷大小</label>
              <span id="brush-size-display" class="text-sm font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded-md">30px</span>
            </div>
            <input type="range" id="brush-size-slider" min="5" max="100" value="30" class="w-full h-6 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
          </div>
        </div>

        <!-- 共用按鈕 -->
        <div class="grid grid-cols-2 gap-2 mt-1">
          <button id="btn-reset" class="flex items-center justify-center gap-1 bg-gray-100 text-gray-700 text-base font-bold py-2 rounded-xl active:scale-95 transition-transform">
            <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i> 重設原圖
          </button>
          <button id="btn-save" class="flex items-center justify-center gap-1 bg-green-500 text-white text-base font-bold py-2 rounded-xl shadow-md active:scale-95 transition-transform">
            <i data-lucide="download" style="width: 18px; height: 18px;"></i> 存檔
          </button>
        </div>

        <label class="flex items-center justify-center gap-1 bg-blue-600 text-white text-base font-bold py-2 rounded-xl shadow-md active:scale-95 transition-transform cursor-pointer w-full">
          <i data-lucide="upload" style="width: 18px; height: 18px;"></i> 換一張照片
          <input type="file" accept="image/*" class="hidden" id="upload-input-2" />
        </label>
      </div>
    </div>
  </main>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    // ── 狀態變數 ──────────────────────────────────────────────
    let hasImage = false;
    let activeClick = null;
    let currentBaseImageData = null;
    let smartFillMode = 'contiguous';
    const FIXED_TOLERANCE = 30;
    let appMode = 'smart';
    let currentAiEngine = 'imgly';
    let brushMode = 'erase';
    let brushSize = 30;
    let isDrawing = false;
    let lastPos = null;
    let isAiProcessing = false;
    let hairModeEnabled = false;  // 新增
    let refineLevel = 2;          // 新增 (0=關閉 ~ 4=極致)

    let history = [];
    let historyIndex = -1;
    const MAX_HISTORY = 15;

    // ── DOM 參考 ──────────────────────────────────────────────
    const initialContainer = document.getElementById('initial-upload-container');
    const editorContainer = document.getElementById('editor-container');
    const uploadInputs = [document.getElementById('upload-input-1'), document.getElementById('upload-input-2')];
    const mainCanvas = document.getElementById('main-canvas');
    const ctx = mainCanvas.getContext('2d');
    const originalCanvas = document.createElement('canvas');
    const origCtx = originalCanvas.getContext('2d');
    let originalImageData = null;
    let imageWidth = 0, imageHeight = 0;

    const btnModeSmart = document.getElementById('btn-mode-smart');
    const btnModeAi = document.getElementById('btn-mode-ai');
    const btnModeManual = document.getElementById('btn-mode-manual');
    const smartControls = document.getElementById('smart-controls');
    const aiControls = document.getElementById('ai-controls');
    const manualControls = document.getElementById('manual-controls');
    const btnFillContiguous = document.getElementById('btn-fill-contiguous');
    const btnFillGlobal = document.getElementById('btn-fill-global');
    const btnEngineImgly = document.getElementById('btn-engine-imgly');
    const btnEngineMediapipe = document.getElementById('btn-engine-mediapipe');
    const aiEngineHint = document.getElementById('ai-engine-hint');
    const btnRunAi = document.getElementById('btn-run-ai');
    const runAiText = document.getElementById('run-ai-text');
    const aiLoading = document.getElementById('ai-loading');
    const aiStatusText = document.getElementById('ai-status-text');
    const btnBrushErase = document.getElementById('btn-brush-erase');
    const btnBrushRestore = document.getElementById('btn-brush-restore');
    const brushSizeSlider = document.getElementById('brush-size-slider');
    const brushSizeDisplay = document.getElementById('brush-size-display');
    const btnReset = document.getElementById('btn-reset');
    const btnSave = document.getElementById('btn-save');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const hintText = document.getElementById('hint-text');
    const hintIcon = document.getElementById('hint-icon');
    const brushCursor = document.getElementById('brush-cursor');
    
    // 新增 UI 元素
    const refineSlider = document.getElementById('refine-slider');
    const refineValueDisplay = document.getElementById('refine-value-display');
    const refineHint = document.getElementById('refine-hint');
    const btnHairMode = document.getElementById('btn-hair-mode');
    const hairToggleKnob = document.getElementById('hair-toggle-knob');
    const btnReRefine = document.getElementById('btn-rerefine');

    // ── 精修等級設定 ──────────────────────────────────────────
    const REFINE_PRESETS = [
      { label: '關閉', hint: '✦ 關閉：直接使用 AI 原始去背結果，不做額外處理', blur: 0, erode: 0, threshold: 0 },
      { label: '輕微', hint: '✦ 輕微：細微邊緣平滑，保留最多細節，適合輪廓清晰的照片', blur: 1, erode: 0, threshold: 5 },
      { label: '標準', hint: '✦ 標準：平衡去背乾淨與細節保留，適合大多數人像', blur: 2, erode: 1, threshold: 10 },
      { label: '強力', hint: '✦ 強力：積極清除邊緣雜訊，適合背景複雜、邊緣不清晰的照片', blur: 3, erode: 2, threshold: 20 },
      { label: '極致', hint: '✦ 極致：最大限度去除背景殘留，邊緣最乾淨，可能略微裁切主體', blur: 4, erode: 3, threshold: 30 }
    ];

    // ── 歷史狀態 ─────────────────────────────────────────────
    function saveState() {
      if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
      history.push({
        imageData: ctx.getImageData(0, 0, imageWidth, imageHeight),
        preClickImageData: currentBaseImageData ? new ImageData(new Uint8ClampedArray(currentBaseImageData.data), imageWidth, imageHeight) : null,
        activeClick: activeClick ? { ...activeClick } : null,
        smartFillMode
      });
      if (history.length > MAX_HISTORY) history.shift();
      else historyIndex++;
      updateUndoRedoUI();
    }

    function applyState(state) {
      ctx.putImageData(state.imageData, 0, 0);
      activeClick = state.activeClick ? { ...state.activeClick } : null;
      currentBaseImageData = state.preClickImageData ? new ImageData(new Uint8ClampedArray(state.preClickImageData.data), imageWidth, imageHeight) : null;
      smartFillMode = state.smartFillMode || 'contiguous';
      updateUI();
      updateUndoRedoUI();
    }

    // ── 邊緣精修核心演算法 ────────────────────────────────────

    /**
     * 對 alpha 通道做高斯模糊（僅模糊 alpha 以實現羽化）
     * radius: 模糊半徑 (像素)
     */
    function blurAlpha(data, width, height, radius) {
      if (radius <= 0) return;
      const alpha = new Float32Array(width * height);
      for (let i = 0; i < width * height; i++) alpha[i] = data[i * 4 + 3];

      // 水平方向
      const temp = new Float32Array(width * height);
      const sigma = radius;
      const kernelSize = Math.ceil(sigma * 3) * 2 + 1;
      const kernel = new Float32Array(kernelSize);
      let sum = 0;
      const half = Math.floor(kernelSize / 2);
      for (let i = 0; i < kernelSize; i++) {
        const x = i - half;
        kernel[i] = Math.exp(-(x * x) / (2 * sigma * sigma));
        sum += kernel[i];
      }
      for (let i = 0; i < kernelSize; i++) kernel[i] /= sum;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let val = 0;
          for (let k = 0; k < kernelSize; k++) {
            const sx = Math.min(Math.max(x + k - half, 0), width - 1);
            val += alpha[y * width + sx] * kernel[k];
          }
          temp[y * width + x] = val;
        }
      }
      // 垂直方向
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let val = 0;
          for (let k = 0; k < kernelSize; k++) {
            const sy = Math.min(Math.max(y + k - half, 0), height - 1);
            val += temp[sy * width + x] * kernel[k];
          }
          alpha[y * width + x] = val;
        }
      }

      for (let i = 0; i < width * height; i++) data[i * 4 + 3] = Math.round(alpha[i]);
    }

    /**
     * 形態學侵蝕：縮小前景，去除邊緣毛邊
     * iterations: 侵蝕次數
     */
    function erodeAlpha(data, width, height, iterations) {
      for (let iter = 0; iter < iterations; iter++) {
        const original = new Uint8ClampedArray(data.length);
        for (let i = 0; i < data.length; i++) original[i] = data[i];

        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            const idx = (y * width + x) * 4 + 3;
            if (original[idx] > 0) {
              // 檢查 4-連通鄰居中是否有透明像素
              const top    = original[((y - 1) * width + x) * 4 + 3];
              const bottom = original[((y + 1) * width + x) * 4 + 3];
              const left   = original[(y * width + (x - 1)) * 4 + 3];
              const right  = original[(y * width + (x + 1)) * 4 + 3];
              const minNeighbor = Math.min(top, bottom, left, right);
              // 取自身與最小鄰居的平均，實現漸進侵蝕
              data[idx] = Math.round((original[idx] + minNeighbor) / 2);
            }
          }
        }
      }
    }

    /**
     * Alpha 閾值截斷：低於閾值的半透明像素直接變透明
     * 清除邊緣的半透明殘留背景
     */
    function thresholdAlpha(data, threshold) {
      if (threshold <= 0) return;
      for (let i = 3; i < data.length; i += 4) {
        if (data[i] < threshold) data[i] = 0;
      }
    }

    /**
     * Alpha Matting 髮絲保留演算法（升級版）
     * 多圈採樣 + 距離加權，複雜背景下效果更佳
     */
    function applyAlphaMatting(data, origData, width, height) {
      // 建立 alpha 快取，避免在迴圈中重複讀取修改中的陣列
      const alphaCache = new Uint8ClampedArray(width * height);
      for (let i = 0; i < width * height; i++) alphaCache[i] = data[i * 4 + 3];

      // 對每個邊緣像素，向外擴展 3 圈採樣半徑，確保採到足夠的前景/背景樣本
      const RADII = [3, 6, 10]; // 三圈採樣，複雜背景時外圈仍能找到明確前景/背景

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const a = alphaCache[y * width + x];

          // 只處理邊緣半透明區域
          if (a <= 8 || a >= 248) continue;

          let fgR = 0, fgG = 0, fgB = 0, fgWeight = 0;
          let bgR = 0, bgG = 0, bgB = 0, bgWeight = 0;

          for (const radius of RADII) {
            for (let dy = -radius; dy <= radius; dy++) {
              for (let dx = -radius; dx <= radius; dx++) {
                // 只採樣當前半徑環上的像素（避免重複加權）
                if (Math.abs(dy) !== radius && Math.abs(dx) !== radius) continue;
                const nx = Math.max(0, Math.min(width - 1, x + dx));
                const ny = Math.max(0, Math.min(height - 1, y + dy));
                const nAlpha = alphaCache[ny * width + nx];
                const nIdx = (ny * width + nx) * 4;
                const oR = origData[nIdx], oG = origData[nIdx + 1], oB = origData[nIdx + 2];
                // 距離越近，權重越高
                const dist = Math.sqrt(dx * dx + dy * dy);
                const w = 1 / (dist + 0.5);

                if (nAlpha >= 235) { fgR += oR * w; fgG += oG * w; fgB += oB * w; fgWeight += w; }
                else if (nAlpha <= 20) { bgR += oR * w; bgG += oG * w; bgB += oB * w; bgWeight += w; }
              }
            }
            // 已採到足夠樣本就停止（不需要採更大的圈）
            if (fgWeight > 2 && bgWeight > 2) break;
          }

          if (fgWeight < 0.5 || bgWeight < 0.5) continue;

          const fR = fgR / fgWeight, fG = fgG / fgWeight, fB = fgB / fgWeight;
          const bR = bgR / bgWeight, bG = bgG / bgWeight, bB = bgB / bgWeight;
          const cR = origData[idx], cG = origData[idx + 1], cB = origData[idx + 2];

          // 最小二乘法估算 alpha
          const dR = fR - bR, dG = fG - bG, dB = fB - bB;
          const nR = cR - bR, nG = cG - bG, nB = cB - bB;
          const denom = dR * dR + dG * dG + dB * dB;
          if (denom < 1) continue;

          const estimatedAlpha = Math.max(0, Math.min(1, (dR * nR + dG * nG + dB * nB) / denom));

          // 根據原始 alpha 的不確定性決定混合比例
          // alpha 越靠近 128（最不確定），越相信估算值
          const uncertainty = 1 - Math.abs(a / 255 - 0.5) * 2;
          const trustEstimate = 0.3 + uncertainty * 0.5; // 範圍 0.3~0.8
          const blended = (a / 255) * (1 - trustEstimate) + estimatedAlpha * trustEstimate;
          data[idx + 3] = Math.round(blended * 255);
        }
      }
    }

    /**
     * Guided Filter（引導式濾波器）邊緣精修
     * 利用原圖的邊緣資訊引導 alpha 通道，保留邊緣同時平滑平坦區域
     * 這是專業去背軟體的核心技術之一
     */
    function applyGuidedFilterAlpha(data, origData, width, height, radius, epsilon) {
      const N = width * height;
      const alpha = new Float32Array(N);
      const guideR = new Float32Array(N);
      const guideG = new Float32Array(N);
      const guideB = new Float32Array(N);

      for (let i = 0; i < N; i++) {
        alpha[i] = data[i * 4 + 3] / 255;
        guideR[i] = origData[i * 4] / 255;
        guideG[i] = origData[i * 4 + 1] / 255;
        guideB[i] = origData[i * 4 + 2] / 255;
      }

      // box filter（快速均值模糊）
      function boxFilter(arr, w, h, r) {
        const out = new Float32Array(arr.length);
        const temp = new Float32Array(arr.length);
        // 水平
        for (let y = 0; y < h; y++) {
          let sum = 0, cnt = 0;
          for (let x = 0; x < w; x++) {
            sum += arr[y * w + x]; cnt++;
            if (x > r) { sum -= arr[y * w + x - r - 1]; cnt--; }
            if (x >= r) temp[y * w + x - r] = sum / cnt;
          }
          // 右側邊界
          for (let x = w - r; x < w; x++) {
            sum -= arr[y * w + x - r]; cnt--;
            temp[y * w + x] = sum / cnt;
          }
        }
        // 垂直
        for (let x = 0; x < w; x++) {
          let sum = 0, cnt = 0;
          for (let y = 0; y < h; y++) {
            sum += temp[y * w + x]; cnt++;
            if (y > r) { sum -= temp[(y - r - 1) * w + x]; cnt--; }
            if (y >= r) out[(y - r) * w + x] = sum / cnt;
          }
          for (let y = h - r; y < h; y++) {
            sum -= temp[(y - r) * w + x]; cnt--;
            out[y * w + x] = sum / cnt;
          }
        }
        return out;
      }

      const meanA  = boxFilter(alpha,  width, height, radius);
      const meanGR = boxFilter(guideR, width, height, radius);
      const meanGG = boxFilter(guideG, width, height, radius);
      const meanGB = boxFilter(guideB, width, height, radius);

      const covAGR = new Float32Array(N);
      const covAGG = new Float32Array(N);
      const covAGB = new Float32Array(N);
      const varGRR = new Float32Array(N);
      const varGGG = new Float32Array(N);
      const varGBB = new Float32Array(N);

      for (let i = 0; i < N; i++) {
        covAGR[i] = alpha[i] * guideR[i] - meanA[i] * meanGR[i];
        covAGG[i] = alpha[i] * guideG[i] - meanA[i] * meanGG[i];
        covAGB[i] = alpha[i] * guideB[i] - meanA[i] * meanGB[i];
        varGRR[i] = guideR[i] * guideR[i] - meanGR[i] * meanGR[i] + epsilon;
        varGGG[i] = guideG[i] * guideG[i] - meanGG[i] * meanGG[i] + epsilon;
        varGBB[i] = guideB[i] * guideB[i] - meanGB[i] * meanGB[i] + epsilon;
      }

      const mCovAGR = boxFilter(covAGR, width, height, radius);
      const mCovAGG = boxFilter(covAGG, width, height, radius);
      const mCovAGB = boxFilter(covAGB, width, height, radius);
      const mVarGRR = boxFilter(varGRR, width, height, radius);
      const mVarGGG = boxFilter(varGGG, width, height, radius);
      const mVarGBB = boxFilter(varGBB, width, height, radius);

      const aR = new Float32Array(N), aG = new Float32Array(N), aB = new Float32Array(N);
      const b  = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        aR[i] = mCovAGR[i] / mVarGRR[i];
        aG[i] = mCovAGG[i] / mVarGGG[i];
        aB[i] = mCovAGB[i] / mVarGBB[i];
        b[i]  = meanA[i] - aR[i] * meanGR[i] - aG[i] * meanGG[i] - aB[i] * meanGB[i];
      }

      const maR = boxFilter(aR, width, height, radius);
      const maG = boxFilter(aG, width, height, radius);
      const maB = boxFilter(aB, width, height, radius);
      const mb  = boxFilter(b,  width, height, radius);

      for (let i = 0; i < N; i++) {
        const refined = maR[i] * guideR[i] + maG[i] * guideG[i] + maB[i] * guideB[i] + mb[i];
        data[i * 4 + 3] = Math.round(Math.max(0, Math.min(1, refined)) * 255);
      }
    }

    /**
     * 主要精修入口：對當前 canvas 的去背結果進行後處理
     * useGuidedFilter: 是否啟用 Guided Filter（計算較重，但複雜背景效果最好）
     */
    function applyEdgeRefinement(level, hairMode, useGuidedFilter = false) {
      if (level === 0 && !hairMode && !useGuidedFilter) return;

      const preset = REFINE_PRESETS[level];
      const currentData = ctx.getImageData(0, 0, imageWidth, imageHeight);
      const data = currentData.data;
      const origData = origCtx.getImageData(0, 0, imageWidth, imageHeight).data;

      // Step 1: Alpha 閾值截斷（去除薄薄的背景殘留）
      thresholdAlpha(data, preset.threshold);

      // Step 2: 形態學侵蝕（縮緊邊緣，去除毛邊）
      if (preset.erode > 0) erodeAlpha(data, imageWidth, imageHeight, preset.erode);

      // Step 3: Guided Filter（引導式濾波，利用原圖邊緣資訊精修 alpha）
      // 在 Alpha Matting 之前執行，讓 alpha 先有較好的初始品質
      if (useGuidedFilter) {
        const gfRadius = Math.max(2, Math.min(8, Math.round(level * 1.5)));
        const gfEpsilon = 0.001 + (4 - level) * 0.002; // 強度越高 epsilon 越小，邊緣越銳利
        applyGuidedFilterAlpha(data, origData, imageWidth, imageHeight, gfRadius, gfEpsilon);
      }

      // Step 4: Alpha Matting 髮絲保留（擴大採樣，複雜背景更準）
      if (hairMode) applyAlphaMatting(data, origData, imageWidth, imageHeight);

      // Step 5: 邊緣高斯羽化（最終讓邊緣自然平滑）
      if (preset.blur > 0) blurAlpha(data, imageWidth, imageHeight, preset.blur);

      ctx.putImageData(currentData, 0, 0);
    }

    // ── 外部腳本載入 ──────────────────────────────────────────
    function loadScript(src, fallbackSrc) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`) || document.querySelector(`script[src="${fallbackSrc}"]`)) {
          resolve(); return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.crossOrigin = "anonymous";
        script.onload = resolve;
        script.onerror = () => {
          if (fallbackSrc) {
            const fb = document.createElement('script');
            fb.src = fallbackSrc;
            fb.crossOrigin = "anonymous";
            fb.onload = resolve;
            fb.onerror = () => reject(new Error(`無法載入: ${fallbackSrc}`));
            document.head.appendChild(fb);
          } else reject(new Error(`無法載入: ${src}`));
        };
        document.head.appendChild(script);
      });
    }

    // ── AI 引擎 ──────────────────────────────────────────────
    async function runAI() {
      if (currentAiEngine === 'imgly') await runAIImgly();
      else await runAIMediaPipe();
    }

    // 用 blob script 方式載入 imgly ESM，相容 file:// 協議
    function loadImglyESM() {
      return new Promise((resolve, reject) => {
        if (window.__imglyRemoveBackground) { resolve(window.__imglyRemoveBackground); return; }

        const sources = [
          'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm',
          'https://esm.sh/@imgly/background-removal@1.5.5'
        ];

        let tried = 0;
        function tryNext() {
          if (tried >= sources.length) { reject(new Error('所有來源載入失敗')); return; }
          const src = sources[tried++];

          // 用 blob URL 包裝 module script，迴避 file:// 的 ESM import 限制
          const code = `import { removeBackground } from '${src}';\nwindow.__imglyRemoveBackground = removeBackground;`;
          const blob = new Blob([code], { type: 'text/javascript' });
          const blobUrl = URL.createObjectURL(blob);
          const script = document.createElement('script');
          script.type = 'module';
          script.src = blobUrl;
          script.onload = () => {
            URL.revokeObjectURL(blobUrl);
            setTimeout(() => {
              if (window.__imglyRemoveBackground) resolve(window.__imglyRemoveBackground);
              else tryNext();
            }, 300);
          };
          script.onerror = () => { URL.revokeObjectURL(blobUrl); tryNext(); };
          document.head.appendChild(script);
        }
        tryNext();
      });
    }

    async function runAIImgly() {
      if (isAiProcessing || !hasImage) return;
      isAiProcessing = true;
      btnRunAi.classList.add('hidden');
      aiLoading.classList.remove('hidden');

      try {
        aiStatusText.innerText = "初始化高精度 AI...";
        const removeBackground = await loadImglyESM();

        aiStatusText.innerText = "準備分析圖片...";
        const imageBlob = await new Promise(resolve => originalCanvas.toBlob(resolve, 'image/png'));

        const blob = await removeBackground(imageBlob, {
          // medium model 對全身照、複雜背景精度比 small 高約 20%
          model: 'medium',
          progress: (key, current, total) => {
            if (total) aiStatusText.innerText = `下載模型 / 處理中... ${Math.round((current / total) * 100)}%`;
            else aiStatusText.innerText = `正在精細扣圖中...`;
          }
        });

        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, imageWidth, imageHeight);
          ctx.drawImage(img, 0, 0, imageWidth, imageHeight);
          URL.revokeObjectURL(url);

          // 套用邊緣精修（全身照預設啟用 Guided Filter）
          const needRefine = refineLevel > 0 || hairModeEnabled;
          if (needRefine) {
            aiStatusText.innerText = "套用邊緣精修...";
            setTimeout(() => {
              applyEdgeRefinement(refineLevel, hairModeEnabled, true /* Guided Filter */);
              saveState();
              btnReRefine.disabled = false;
              finishAiProcessing();
            }, 50);
          } else {
            saveState();
            btnReRefine.disabled = false;
            finishAiProcessing();
          }
        };
        img.src = url;

      } catch (err) {
        alert('高精度 AI 模型載入失敗，可能是網路問題。');
        console.error(err);
        finishAiProcessing();
      }
    }

    async function runAIMediaPipe() {
      if (isAiProcessing || !hasImage) return;
      isAiProcessing = true;
      btnRunAi.classList.add('hidden');
      aiLoading.classList.remove('hidden');

      try {
        aiStatusText.innerText = "載入 MediaPipe 引擎...";
        if (!window.SelfieSegmentation) {
          await loadScript(
            'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js',
            'https://unpkg.com/@mediapipe/selfie_segmentation/selfie_segmentation.js'
          );
        }

        aiStatusText.innerText = "正在極速辨識人像邊緣...";

        await new Promise((resolve, reject) => {
          const selfieSegmentation = new window.SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
          });
          selfieSegmentation.setOptions({ modelSelection: 1 });

          selfieSegmentation.onResults((results) => {
            try {
              // ✨ 改進：先生成浮點精度 mask，再處理
              const maskCanvas = document.createElement('canvas');
              maskCanvas.width = imageWidth;
              maskCanvas.height = imageHeight;
              const maskCtx = maskCanvas.getContext('2d');
              maskCtx.drawImage(results.segmentationMask, 0, 0, imageWidth, imageHeight);
              const maskData = maskCtx.getImageData(0, 0, imageWidth, imageHeight).data;

              const currentData = ctx.getImageData(0, 0, imageWidth, imageHeight);

              // ✨ 改進：用浮點混合，保留更多邊緣細節
              for (let i = 0; i < maskData.length; i += 4) {
                const maskAlpha = maskData[i]; // MediaPipe mask 的 R 通道 = 前景機率
                currentData.data[i + 3] = Math.round((currentData.data[i + 3] * maskAlpha) / 255);
              }

              ctx.putImageData(currentData, 0, 0);

              // 套用邊緣精修（MediaPipe 全身照也用 Guided Filter）
              if (refineLevel > 0 || hairModeEnabled) {
                applyEdgeRefinement(refineLevel, hairModeEnabled, true /* Guided Filter */);
              }

              saveState();
              btnReRefine.disabled = false;
              resolve();
            } catch (e) { reject(e); }
          });

          selfieSegmentation.send({ image: originalCanvas }).catch(reject);
        });

      } catch (err) {
        alert('MediaPipe 模型載入失敗，請檢查網路。');
        console.error(err);
      } finally {
        finishAiProcessing();
      }
    }

    function finishAiProcessing() {
      isAiProcessing = false;
      btnRunAi.classList.remove('hidden');
      aiLoading.classList.add('hidden');
      aiLoading.style.display = '';
    }

    // ── 圖片上傳 ──────────────────────────────────────────────
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 1080;
          let w = img.width, h = img.height;
          if (w > MAX_DIM || h > MAX_DIM) {
            const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
            w = Math.floor(w * ratio); h = Math.floor(h * ratio);
          }
          imageWidth = w; imageHeight = h;
          mainCanvas.width = w; mainCanvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          originalCanvas.width = w; originalCanvas.height = h;
          origCtx.drawImage(img, 0, 0, w, h);
          originalImageData = ctx.getImageData(0, 0, w, h);
          activeClick = null; currentBaseImageData = null;
          smartFillMode = 'contiguous'; appMode = 'smart'; hasImage = true;
          history = []; historyIndex = -1;
          updateUI(); saveState();
        };
        img.onerror = () => alert('無法讀取圖片，請確認檔案格式是否正確。');
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    // ── 魔術棒 ────────────────────────────────────────────────
    function colorDistance(r1, g1, b1, r2, g2, b2) {
      return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
    }

    function processSmartImage() {
      if (!currentBaseImageData || !activeClick) return;
      const { x: startX, y: startY } = activeClick;
      const originalData = currentBaseImageData.data;
      const newImgData = new ImageData(new Uint8ClampedArray(originalData), imageWidth, imageHeight);
      const data = newImgData.data;
      const startIndex = (startY * imageWidth + startX) * 4;
      const targetR = originalData[startIndex], targetG = originalData[startIndex + 1], targetB = originalData[startIndex + 2];
      if (originalData[startIndex + 3] === 0) { ctx.putImageData(newImgData, 0, 0); return; }
      const currentTol = (FIXED_TOLERANCE / 100) * 441.67;

      if (smartFillMode === 'global') {
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] > 0 && colorDistance(data[i], data[i+1], data[i+2], targetR, targetG, targetB) <= currentTol)
            data[i + 3] = 0;
        }
      } else {
        const visited = new Uint8Array(imageWidth * imageHeight);
        const qX = new Int32Array(imageWidth * imageHeight);
        const qY = new Int32Array(imageWidth * imageHeight);
        let head = 0, tail = 1;
        qX[0] = startX; qY[0] = startY;
        visited[startY * imageWidth + startX] = 1;
        while (head < tail) {
          const x = qX[head], y = qY[head++];
          data[(y * imageWidth + x) * 4 + 3] = 0;
          const neighbors = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
          for (const [nx, ny] of neighbors) {
            if (nx < 0 || nx >= imageWidth || ny < 0 || ny >= imageHeight) continue;
            const nIdx = ny * imageWidth + nx;
            if (visited[nIdx]) continue;
            visited[nIdx] = 1;
            const pxIdx = nIdx * 4;
            if (data[pxIdx+3] > 0 && colorDistance(data[pxIdx], data[pxIdx+1], data[pxIdx+2], targetR, targetG, targetB) <= currentTol) {
              qX[tail] = nx; qY[tail++] = ny;
            }
          }
        }
      }
      ctx.putImageData(newImgData, 0, 0);
    }

    // ── 座標轉換 ──────────────────────────────────────────────
    function getCoordinates(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    // ── 筆刷繪製 ──────────────────────────────────────────────
    function drawPoint(x, y) {
      if (brushMode === 'erase') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(x, y, brushSize, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.save();
        ctx.beginPath(); ctx.arc(x, y, brushSize, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(originalCanvas, 0, 0);
        ctx.restore();
      }
    }

    function updateBrushCursor(e) {
      if (appMode !== 'manual' || !hasImage) { brushCursor.classList.add('hidden'); return; }
      brushCursor.classList.remove('hidden');
      const rect = mainCanvas.getBoundingClientRect();
      const cssSize = (brushSize * 2) / (mainCanvas.width / rect.width);
      brushCursor.style.width = `${cssSize}px`;
      brushCursor.style.height = `${cssSize}px`;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      brushCursor.style.left = `${clientX}px`;
      brushCursor.style.top = `${clientY}px`;
    }

    // ── 事件綁定 ──────────────────────────────────────────────
    uploadInputs.forEach(input => input.addEventListener('change', handleImageUpload));

    btnUndo.addEventListener('click', () => { if (historyIndex > 0) { historyIndex--; applyState(history[historyIndex]); } });
    btnRedo.addEventListener('click', () => { if (historyIndex < history.length - 1) { historyIndex++; applyState(history[historyIndex]); } });

    btnRunAi.addEventListener('click', runAI);

    // 引擎切換
    btnEngineImgly.addEventListener('click', () => {
      currentAiEngine = 'imgly';
      btnEngineImgly.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-purple-400 bg-white text-purple-600 text-sm";
      btnEngineMediapipe.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-transparent bg-white/50 text-gray-500 text-sm hover:bg-white";
      aiEngineHint.innerText = "⭐ 推薦：全身照、複雜背景、衣物邊緣，精準度最高 (首次下載約 40MB)";
      runAiText.innerText = "啟動高精度去背";
    });

    btnEngineMediapipe.addEventListener('click', () => {
      currentAiEngine = 'mediapipe';
      btnEngineMediapipe.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-purple-400 bg-white text-purple-600 text-sm";
      btnEngineImgly.className = "flex-1 py-2 rounded-lg border-2 font-bold transition-all border-transparent bg-white/50 text-gray-500 text-sm hover:bg-white";
      aiEngineHint.innerText = "適合：半身照、視訊大頭貼 (瞬間完成，邊緣極度平滑)";
      runAiText.innerText = "啟動 MediaPipe 去背";
    });

    // 精修滑桿
    refineSlider.addEventListener('input', (e) => {
      refineLevel = Number(e.target.value);
      const preset = REFINE_PRESETS[refineLevel];
      refineValueDisplay.innerText = preset.label;
      refineHint.innerText = preset.hint;
    });

    // 髮絲模式開關
    btnHairMode.addEventListener('click', () => {
      hairModeEnabled = !hairModeEnabled;
      btnHairMode.setAttribute('aria-checked', hairModeEnabled);
      if (hairModeEnabled) {
        btnHairMode.classList.remove('bg-gray-300');
        btnHairMode.classList.add('bg-violet-500');
        hairToggleKnob.style.transform = 'translateX(24px)';
      } else {
        btnHairMode.classList.add('bg-gray-300');
        btnHairMode.classList.remove('bg-violet-500');
        hairToggleKnob.style.transform = 'translateX(0)';
      }
    });

    // 二次精修按鈕：對現有去背結果再套一次精修流程
    btnReRefine.addEventListener('click', () => {
      if (!hasImage) return;
      // 使用 Guided Filter + 當前設定再精修一次
      applyEdgeRefinement(Math.max(refineLevel, 1), hairModeEnabled, true);
      saveState();
    });

    // Canvas 互動
    mainCanvas.addEventListener('pointerenter', updateBrushCursor);
    mainCanvas.addEventListener('pointerleave', () => brushCursor.classList.add('hidden'));

    mainCanvas.addEventListener('click', (e) => {
      if (!originalImageData || appMode !== 'smart') return;
      const { x, y } = getCoordinates(e);
      const ix = Math.floor(x), iy = Math.floor(y);
      const data = ctx.getImageData(0, 0, imageWidth, imageHeight).data;
      const idx = (iy * imageWidth + ix) * 4;
      if (idx >= 0 && idx < data.length && data[idx + 3] > 0) {
        currentBaseImageData = ctx.getImageData(0, 0, imageWidth, imageHeight);
        activeClick = { x: ix, y: iy };
        processSmartImage();
        saveState();
        updateUI();
      }
    });

    mainCanvas.addEventListener('pointerdown', (e) => {
      if (!originalImageData || appMode !== 'manual') return;
      mainCanvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      const { x, y } = getCoordinates(e);
      drawPoint(x, y); lastPos = { x, y }; updateBrushCursor(e);
    });

    mainCanvas.addEventListener('pointermove', (e) => {
      if (appMode === 'manual') updateBrushCursor(e);
      if (!isDrawing || appMode !== 'manual') return;
      const { x, y } = getCoordinates(e);
      if (lastPos) {
        const dx = x - lastPos.x, dy = y - lastPos.y;
        const steps = Math.max(Math.floor(Math.sqrt(dx*dx+dy*dy) / (brushSize/4)), 1);
        for (let i = 0; i <= steps; i++) drawPoint(lastPos.x + dx*i/steps, lastPos.y + dy*i/steps);
      } else drawPoint(x, y);
      lastPos = { x, y };
    });

    const stopDrawing = (e) => {
      if (appMode === 'manual' && isDrawing) {
        isDrawing = false; lastPos = null;
        mainCanvas.releasePointerCapture(e.pointerId);
        saveState();
      }
    };
    mainCanvas.addEventListener('pointerup', stopDrawing);
    mainCanvas.addEventListener('pointercancel', stopDrawing);

    // 模式切換
    btnModeSmart.addEventListener('click', () => { appMode = 'smart'; updateUI(); brushCursor.classList.add('hidden'); });
    btnModeAi.addEventListener('click', () => { appMode = 'ai'; updateUI(); brushCursor.classList.add('hidden'); });
    btnModeManual.addEventListener('click', () => { appMode = 'manual'; updateUI(); });

    // 去背範圍
    btnFillContiguous.addEventListener('click', () => {
      smartFillMode = 'contiguous'; updateUI();
      if (activeClick && currentBaseImageData) {
        processSmartImage();
        if (history.length > 0) history[historyIndex].imageData = ctx.getImageData(0, 0, imageWidth, imageHeight);
      }
    });
    btnFillGlobal.addEventListener('click', () => {
      smartFillMode = 'global'; updateUI();
      if (activeClick && currentBaseImageData) {
        processSmartImage();
        if (history.length > 0) history[historyIndex].imageData = ctx.getImageData(0, 0, imageWidth, imageHeight);
      }
    });

    // 筆刷
    btnBrushErase.addEventListener('click', () => { brushMode = 'erase'; updateUI(); });
    btnBrushRestore.addEventListener('click', () => { brushMode = 'restore'; updateUI(); });
    brushSizeSlider.addEventListener('input', (e) => {
      brushSize = Number(e.target.value);
      brushSizeDisplay.innerText = `${brushSize}px`;
    });

    // 重設
    btnReset.addEventListener('click', () => {
      if (!originalImageData) return;
      ctx.putImageData(originalImageData, 0, 0);
      activeClick = null; currentBaseImageData = null;
      smartFillMode = 'contiguous'; appMode = 'smart';
      updateUI(); saveState();
    });

    // 存檔
    btnSave.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = mainCanvas.toDataURL('image/png');
      a.download = '去背完成圖片.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });

    // ── UI 更新 ────────────────────────────────────────────────
    function updateUndoRedoUI() {
      btnUndo.disabled = historyIndex <= 0;
      btnRedo.disabled = historyIndex >= history.length - 1;
      btnUndo.classList.toggle('text-blue-600', historyIndex > 0);
      btnRedo.classList.toggle('text-blue-600', historyIndex < history.length - 1);
    }

    function updateUI() {
      if (hasImage) {
        initialContainer.classList.add('hidden');
        editorContainer.classList.remove('hidden');
      } else {
        initialContainer.classList.remove('hidden');
        editorContainer.classList.add('hidden');
      }

      btnModeSmart.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500";
      btnModeAi.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500";
      btnModeManual.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors text-gray-500";
      smartControls.classList.add('hidden');
      aiControls.classList.add('hidden');
      manualControls.classList.add('hidden');

      if (appMode === 'smart') {
        btnModeSmart.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-blue-600 shadow";
        smartControls.classList.remove('hidden');
        mainCanvas.classList.remove('cursor-none'); mainCanvas.classList.add('cursor-crosshair'); mainCanvas.classList.remove('touch-none');
        hintIcon.setAttribute('data-lucide', 'mouse-pointer-2');
        hintText.innerText = activeClick ? '繼續點擊圖片中想去除的背景' : '請點擊圖片選擇要去背的背景顏色';
        btnFillContiguous.className = `flex-1 py-2 rounded-xl border-2 font-bold transition-all ${smartFillMode === 'contiguous' ? 'border-blue-400 bg-blue-50 text-blue-600' : 'border-transparent bg-gray-100 text-gray-500'}`;
        btnFillGlobal.className = `flex-1 py-2 rounded-xl border-2 font-bold transition-all ${smartFillMode === 'global' ? 'border-blue-400 bg-blue-50 text-blue-600' : 'border-transparent bg-gray-100 text-gray-500'}`;

      } else if (appMode === 'ai') {
        btnModeAi.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-purple-600 shadow";
        aiControls.classList.remove('hidden');
        mainCanvas.classList.remove('cursor-none', 'cursor-crosshair', 'touch-none');
        hintIcon.setAttribute('data-lucide', 'sparkles');
        hintText.innerText = '選擇下方 AI 引擎並開始辨識';

      } else {
        btnModeManual.className = "flex-1 flex justify-center items-center gap-1 py-2 rounded-lg text-sm md:text-base font-bold transition-colors bg-white text-red-600 shadow";
        manualControls.classList.remove('hidden');
        mainCanvas.classList.add('cursor-none', 'touch-none'); mainCanvas.classList.remove('cursor-crosshair');
        hintIcon.setAttribute('data-lucide', 'brush');
        hintText.innerText = '使用筆刷塗抹來去除或還原';
        btnBrushErase.className = `flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all ${brushMode === 'erase' ? 'border-red-400 bg-red-50 text-red-600' : 'border-transparent bg-gray-100 text-gray-500'}`;
        btnBrushRestore.className = `flex-1 flex flex-col items-center justify-center gap-1 py-2 rounded-xl border-2 transition-all ${brushMode === 'restore' ? 'border-green-400 bg-green-50 text-green-600' : 'border-transparent bg-gray-100 text-gray-500'}`;
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
  </script>
</body>
</html>
