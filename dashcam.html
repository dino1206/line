<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web 行車記錄器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 徹底鎖死畫面，防止任何滑動與彈性滾動 */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; touch-action: none; overscroll-behavior: none; }
        /* Canvas 預覽畫面填滿 */
        #camera-preview { object-fit: cover; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        /* UI 覆蓋層 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        /* 讓按鈕可以被點擊 */
        .interactive { pointer-events: auto; }
        /* 閃爍動畫 */
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .recording-dot { animation: blink 1.5s infinite; color: red; }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <!-- 啟動與權限請求畫面 (解決手機全螢幕與轉向限制) -->
    <div id="start-screen" class="fixed inset-0 bg-gray-900 z-[100] flex flex-col items-center justify-center interactive p-6">
        <i class="fas fa-car-side text-6xl text-blue-500 mb-6"></i>
        <h1 class="text-3xl font-bold mb-2">Web 行車記錄器</h1>
        <p class="text-gray-400 text-center mb-8 max-w-sm">為了獲得最佳體驗，系統將進入全螢幕模式並建議以橫向放置手機。</p>
        <button onclick="enterDashcamMode()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.5)] text-lg transition transform active:scale-95 flex items-center gap-3">
            <i class="fas fa-power-off"></i> 啟動系統
        </button>
    </div>

    <!-- 原始攝影機影像 (隱藏層) -->
    <video id="hidden-video" autoplay muted playsinline style="position: absolute; opacity: 0.01; z-index: -1; pointer-events: none; width: 100%; height: 100%;"></video>

    <!-- 實際顯示與錄製用的 Canvas (包含燒錄的時間) -->
    <canvas id="camera-preview"></canvas>

    <!-- UI 覆蓋層 -->
    <div id="ui-layer" class="p-4 sm:p-6 relative">
        
        <!-- 頂部資訊 -->
        <div class="flex justify-between items-start interactive relative z-10">
            <!-- 左側：狀態面板 -->
            <div class="bg-black/60 backdrop-blur-md rounded-lg p-3 border border-white/20 shadow-lg">
                <div id="status-text" class="text-base sm:text-lg font-bold flex items-center gap-2">
                    <i class="fas fa-video"></i> 系統就緒
                </div>
                <div id="wake-lock-status" class="text-[10px] sm:text-xs text-green-400 mt-1 hidden">
                    <i class="fas fa-sun"></i> 螢幕長亮防休眠已啟動
                </div>
                <!-- 該節錄影進度顯示 -->
                <div id="timer-text" class="text-base sm:text-xl text-yellow-400 mt-1 sm:mt-2 font-mono font-bold hidden tracking-wider">
                    <i class="fas fa-stopwatch mr-1"></i><span id="time-elapsed">00:00</span> / 03:00
                </div>
                <div class="text-[10px] sm:text-xs text-gray-300 mt-1 sm:mt-2">背景循環槽位: <span id="current-index-display">1</span>/20</div>
            </div>

            <!-- 右側：功能按鈕群 -->
            <div class="flex flex-col items-end gap-2 sm:gap-3">
                <button onclick="saveCurrentToAlbum()" class="bg-blue-600/90 hover:bg-blue-500 px-3 py-2 sm:px-4 sm:py-2.5 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.6)] transition duration-200 border border-blue-400 flex items-center gap-2 active:scale-95">
                    <i class="fas fa-download text-base sm:text-lg"></i>
                    <span class="font-bold tracking-wider text-xs sm:text-sm">直接存入</span>
                </button>
                <button onclick="openGallery()" class="bg-gray-800/80 hover:bg-gray-700 px-3 py-2 sm:px-4 sm:py-2.5 rounded-full shadow-lg transition duration-200 border border-gray-600 flex items-center gap-2 active:scale-95">
                    <i class="fas fa-folder-open text-yellow-500 text-base sm:text-lg"></i>
                    <span class="font-bold tracking-wider text-xs sm:text-sm text-gray-200">歷史檔案</span>
                </button>
            </div>
        </div>

        <!-- 畫面下方控制項 -->
        <div class="flex flex-col items-center justify-end h-full pb-2 sm:pb-6 interactive">
            <!-- 錄影按鈕 -->
            <button id="record-btn" onclick="toggleRecording()" class="flex flex-col items-center justify-center w-20 h-20 sm:w-24 sm:h-24 bg-red-600 hover:bg-red-500 rounded-full shadow-[0_0_20px_rgba(220,38,38,0.6)] border-4 border-white/20 transition duration-300 transform active:scale-95">
                <i id="record-icon" class="fas fa-circle text-2xl sm:text-3xl mb-1"></i>
                <span id="record-label" class="text-[10px] sm:text-xs font-bold uppercase tracking-wider">開始錄影</span>
            </button>
        </div>
    </div>

    <!-- 檔案庫 Modal -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col interactive">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900">
            <h2 class="text-xl font-bold"><i class="fas fa-archive mr-2"></i> 內部儲存檔案庫 (上限20個)</h2>
            <button onclick="closeGallery()" class="p-2 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
        <div class="p-4 bg-yellow-900/30 text-yellow-200 text-sm border-b border-yellow-700/50 flex items-start gap-2">
            <i class="fas fa-info-circle mt-0.5"></i> 
            <div>提示：瀏覽此清單時，背景的錄影<b>會持續進行</b>。如果手機內建播放器會卡頓，建議下載後使用 VLC 等專業播放器觀看。</div>
        </div>
        <div id="file-list" class="flex-1 overflow-y-auto p-4 space-y-3">
            <div class="text-center text-gray-500 mt-10">載入中...</div>
        </div>
    </div>

    <!-- 空間不足警告 Modal -->
    <div id="storage-warning-modal" class="fixed inset-0 bg-black/95 z-[60] hidden flex flex-col justify-center items-center p-4 interactive">
        <div class="bg-gray-900 border border-red-500 rounded-xl p-6 max-w-sm w-full text-center shadow-[0_0_30px_rgba(220,38,38,0.4)]">
            <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
            <h2 class="text-2xl font-bold text-white mb-3">儲存空間不足</h2>
            <div class="bg-black/50 rounded p-3 mb-4 text-left border border-gray-800">
                <p class="text-gray-300 text-sm mb-2">安全運作需求：<span class="text-green-400 font-mono">2.00 GB</span></p>
                <p class="text-gray-300 text-sm">目前剩餘空間：<span id="available-gb-text" class="text-red-400 font-mono font-bold"></span></p>
            </div>
            <p class="text-gray-400 text-sm mb-6 text-left">
                為了確保影片檔能順利儲存且不會中途當機，系統已自動攔截錄影。<br><br>
                請清理手機儲存空間，然後再試一次。
            </p>
            <button onclick="closeStorageWarning()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition active:scale-95">
                我知道了
            </button>
        </div>
    </div>

    <script>
        // --- 核心變數設定 ---
        const CYCLE_LIMIT = 20; 
        const RECORD_DURATION_MS = 3 * 60 * 1000; 
        const REQUIRED_SPACE_BYTES = 2 * 1024 * 1024 * 1024; 
        
        let cameraStream = null;      
        let canvasStream = null;      
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordTimer = null;
        let displayTimer = null;
        let startTime = 0;
        let wakeLock = null; 
        let isEmergencySave = false;
        
        let currentIndex = parseInt(localStorage.getItem('dashcam_index')) || 1;
        document.getElementById('current-index-display').innerText = currentIndex;

        // --- 進入系統 (處理全螢幕與旋轉) ---
        async function enterDashcamMode() {
            // 請求全螢幕
            try {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) {
                    await docElm.requestFullscreen();
                } else if (docElm.webkitRequestFullscreen) {
                    await docElm.webkitRequestFullscreen();
                }
            } catch (e) {
                console.warn("無法自動進入全螢幕", e);
            }

            // 請求鎖定橫向 (Landscape)
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {
                console.warn("無法強制鎖定橫向，請手動旋轉手機", e);
            }

            // 隱藏啟動畫面並初始化相機
            document.getElementById('start-screen').classList.add('hidden');
            try {
                await initDB();
                await initCamera();
            } catch (e) {
                console.error("初始化錯誤:", e);
                alert("相機存取失敗，請確認是否給予權限。");
            }
        }

        // --- 螢幕防休眠邏輯 ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wake-lock-status').classList.remove('hidden');
                    wakeLock.addEventListener('release', () => console.log('Screen Wake Lock 釋放'));
                }
            } catch (err) {
                console.warn(`無法請求螢幕喚醒鎖: ${err.name}, ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                    document.getElementById('wake-lock-status').classList.add('hidden');
                });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRecording) {
                await requestWakeLock();
            }
        });

        // --- 儲存空間容量檢查機制 ---
        async function checkStorageSpace() {
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    const estimate = await navigator.storage.estimate();
                    const availableSpace = estimate.quota - estimate.usage;
                    const availableGB = (availableSpace / (1024 * 1024 * 1024)).toFixed(2);
                    
                    if (availableSpace < REQUIRED_SPACE_BYTES) {
                        return { hasSpace: false, availableGB: availableGB + " GB" };
                    }
                    return { hasSpace: true, availableGB: availableGB + " GB" };
                } catch (e) {
                    return { hasSpace: true, availableGB: "未知" }; 
                }
            }
            return { hasSpace: true, availableGB: "瀏覽器不支援" }; 
        }

        function showStorageWarning(availableGB) {
            document.getElementById('available-gb-text').innerText = availableGB;
            document.getElementById('storage-warning-modal').classList.remove('hidden');
        }

        function closeStorageWarning() {
            document.getElementById('storage-warning-modal').classList.add('hidden');
        }

        // --- IndexedDB 儲存邏輯 ---
        const dbName = "DashcamStorage";
        const storeName = "videos";
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onerror = event => reject("資料庫開啟失敗");
                request.onsuccess = event => { db = event.target.result; resolve(); };
                request.onupgradeneeded = event => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName, { keyPath: "id" });
                    }
                };
            });
        }

        async function saveVideoToDB(id, blob, timestamp, mimeType) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], "readwrite");
                const store = transaction.objectStore(storeName);
                const ext = mimeType.includes("mp4") ? "mp4" : "webm";
                const filename = `行車紀錄_備份_${String(id).padStart(2, '0')}.${ext}`;
                
                const data = {
                    id: id,
                    filename: filename,
                    blob: blob,
                    timestamp: timestamp,
                    size: (blob.size / (1024 * 1024)).toFixed(2) + " MB"
                };
                
                const request = store.put(data); 
                request.onsuccess = () => resolve();
                request.onerror = () => reject("儲存失敗");
            });
        }

        async function getAllVideosFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], "readonly");
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => {
                    let results = request.result;
                    results.sort((a, b) => b.timestamp - a.timestamp);
                    resolve(results);
                };
                request.onerror = () => reject("讀取失敗");
            });
        }

        async function deleteVideoFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], "readwrite");
                const store = transaction.objectStore(storeName);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject("刪除失敗");
            });
        }

        // --- 攝影機與 Canvas 浮水印繪製邏輯 ---
        async function initCamera() {
            try {
                // 優先請求高畫質比例
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });
                
                const video = document.getElementById('hidden-video');
                const canvas = document.getElementById('camera-preview');
                const ctx = canvas.getContext('2d');
                
                video.srcObject = cameraStream;
                
                video.addEventListener('loadedmetadata', () => {
                    video.play(); 
                    // 初始化時先設定畫布尺寸
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    
                    canvasStream = canvas.captureStream(30);
                    
                    const audioTracks = cameraStream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        canvasStream.addTrack(audioTracks[0]);
                    }
                });

                function drawCanvas() {
                    if (video.readyState >= 2 && video.videoWidth > 0) {
                        // 【動態尺寸偵測】若手機旋轉導致串流比例改變，畫布自動跟隨調整，防止變窄
                        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                        }

                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        const now = new Date();
                        const yyyy = now.getFullYear();
                        const MM = String(now.getMonth() + 1).padStart(2, '0');
                        const dd = String(now.getDate()).padStart(2, '0');
                        const HH = String(now.getHours()).padStart(2, '0');
                        const mm = String(now.getMinutes()).padStart(2, '0');
                        const ss = String(now.getSeconds()).padStart(2, '0');
                        const timeStr = `${yyyy}/${MM}/${dd}  ${HH}:${mm}:${ss}`;

                        // 【字體縮小優化】調小比例
                        const fontSize = Math.max(16, Math.floor(canvas.height / 28)); 
                        ctx.font = `bold ${fontSize}px monospace`;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "top";
                        
                        ctx.shadowColor = "rgba(0,0,0,0.85)";
                        ctx.shadowBlur = 6;
                        ctx.lineWidth = Math.max(1, Math.floor(fontSize / 15));
                        ctx.strokeStyle = "black";
                        ctx.fillStyle = "#FFD700"; 

                        const textX = canvas.width / 2;
                        const textY = 15; 

                        ctx.strokeText(timeStr, textX, textY);
                        ctx.fillText(timeStr, textX, textY);
                    }
                    requestAnimationFrame(drawCanvas);
                }
                
                requestAnimationFrame(drawCanvas);

            } catch (err) {
                // 將拋出錯誤交由呼叫處處理
                throw err;
            }
        }

        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
                return;
            }

            const spaceInfo = await checkStorageSpace();
            if (spaceInfo.hasSpace === false) {
                showStorageWarning(spaceInfo.availableGB);
                return; 
            }

            if (!canvasStream) return;
            startRecordingSession();
        }

        async function startRecordingSession() {
            isRecording = true;
            await requestWakeLock(); 
            updateUI();
            startSingleCycle();
        }

        function stopRecording() {
            isRecording = false;
            releaseWakeLock(); 
            clearTimeout(recordTimer);
            clearInterval(displayTimer);
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop(); 
            }
            updateUI();
        }

        // --- 手動觸發：直接存入相簿 ---
        function saveCurrentToAlbum() {
            if (!isRecording || !mediaRecorder) {
                alert("請先開始錄影，才能進行存檔喔！");
                return;
            }
            
            isEmergencySave = true;
            if (mediaRecorder.state === "recording") {
                mediaRecorder.stop(); 
            }
        }

        // --- 錄影核心 ---
        function startSingleCycle() {
            if (!isRecording) return;
            recordedChunks = [];
            
            let options = {};
            const preferredTypes = [
                'video/mp4;codecs=avc1',
                'video/mp4',
                'video/webm;codecs=h264',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            
            for (let type of preferredTypes) {
                if (MediaRecorder.isTypeSupported(type)) {
                    options.mimeType = type;
                    break;
                }
            }
            
            options.videoBitsPerSecond = 3000000; 

            try {
                mediaRecorder = new MediaRecorder(canvasStream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(canvasStream); 
            }

            mediaRecorder.ondataavailable = event => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                if (recordedChunks.length > 0) {
                    const finalMimeType = mediaRecorder.mimeType || 'video/webm';
                    const blob = new Blob(recordedChunks, { type: finalMimeType });
                    const timestamp = new Date().getTime();
                    
                    try {
                        await saveVideoToDB(currentIndex, blob, timestamp, finalMimeType);
                    } catch (err) {
                        console.error(err);
                    }

                    if (isEmergencySave) {
                        isEmergencySave = false; 
                        const ext = finalMimeType.includes("mp4") ? "mp4" : "webm";
                        const filename = `行車紀錄_手動存檔_${timestamp}.${ext}`;
                        
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 100);
                    }

                    currentIndex++;
                    if (currentIndex > CYCLE_LIMIT) currentIndex = 1;
                    localStorage.setItem('dashcam_index', currentIndex);
                    document.getElementById('current-index-display').innerText = currentIndex;
                }

                if (isRecording) {
                    startSingleCycle();
                }
            };

            mediaRecorder.start(1000);
            startTime = Date.now();
            
            recordTimer = setTimeout(() => {
                if (mediaRecorder.state === "recording") {
                    mediaRecorder.stop(); 
                }
            }, RECORD_DURATION_MS);

            clearInterval(displayTimer);
            updateTimeDisplay(); 
            displayTimer = setInterval(updateTimeDisplay, 1000);
        }

        // --- UI 更新邏輯 ---
        function updateUI() {
            const btn = document.getElementById('record-btn');
            const icon = document.getElementById('record-icon');
            const label = document.getElementById('record-label');
            const statusText = document.getElementById('status-text');
            const timerText = document.getElementById('timer-text');

            if (isRecording) {
                btn.classList.remove('bg-red-600', 'hover:bg-red-500');
                btn.classList.add('bg-gray-800', 'hover:bg-gray-700', 'border-red-500');
                icon.classList.remove('fa-circle');
                icon.classList.add('fa-stop', 'text-red-500');
                label.innerText = '停止錄影';
                
                statusText.innerHTML = '<i class="fas fa-circle recording-dot"></i> 錄影中';
                timerText.classList.remove('hidden');
            } else {
                btn.classList.add('bg-red-600', 'hover:bg-red-500');
                btn.classList.remove('bg-gray-800', 'hover:bg-gray-700', 'border-red-500');
                icon.classList.add('fa-circle');
                icon.classList.remove('fa-stop', 'text-red-500');
                label.innerText = '開始錄影';

                statusText.innerHTML = '<i class="fas fa-video"></i> 系統就緒';
                timerText.classList.add('hidden');
                document.getElementById('time-elapsed').innerText = "00:00";
            }
        }

        function updateTimeDisplay() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const s = String(elapsed % 60).padStart(2, '0');
            document.getElementById('time-elapsed').innerText = `${m}:${s}`;
        }

        // --- 檔案庫(Gallery)邏輯 ---
        async function openGallery() {
            document.getElementById('gallery-modal').classList.remove('hidden');
            await renderFileList();
        }

        function closeGallery() {
            document.getElementById('gallery-modal').classList.add('hidden');
        }

        async function renderFileList() {
            const listContainer = document.getElementById('file-list');
            listContainer.innerHTML = '<div class="text-center text-gray-500 py-10"><i class="fas fa-spinner fa-spin text-3xl mb-3"></i><br>讀取檔案中...</div>';
            
            try {
                const videos = await getAllVideosFromDB();
                if (videos.length === 0) {
                    listContainer.innerHTML = '<div class="text-center text-gray-500 py-10"><i class="fas fa-box-open text-4xl mb-3"></i><br>目前沒有錄影檔案</div>';
                    return;
                }

                listContainer.innerHTML = '';
                videos.forEach(v => {
                    const date = new Date(v.timestamp).toLocaleString('zh-TW');
                    const isLatest = (v.id === (currentIndex === 1 ? 20 : currentIndex - 1));
                    
                    const item = document.createElement('div');
                    item.className = 'bg-gray-800 rounded-lg p-4 flex items-center justify-between shadow border border-gray-700';
                    item.innerHTML = `
                        <div class="flex-1 overflow-hidden">
                            <div class="font-bold text-lg flex items-center gap-2">
                                ${v.filename}
                                ${isLatest ? '<span class="bg-blue-600 text-xs px-2 py-0.5 rounded text-white">最新</span>' : ''}
                            </div>
                            <div class="text-sm text-gray-400 mt-1"><i class="far fa-clock"></i> ${date}</div>
                            <div class="text-xs text-gray-500 mt-1"><i class="fas fa-hdd"></i> 大小: ${v.size} (Slot: ${v.id})</div>
                        </div>
                        <div class="flex gap-2 ml-4">
                            <button onclick="downloadVideo(${v.id})" class="w-10 h-10 bg-green-600 hover:bg-green-500 rounded-full flex justify-center items-center transition shadow">
                                <i class="fas fa-download"></i>
                            </button>
                            <button onclick="deleteVideoUI(${v.id})" class="w-10 h-10 bg-red-900/80 hover:bg-red-700 text-red-200 rounded-full flex justify-center items-center transition shadow">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (e) {
                listContainer.innerHTML = '<div class="text-center text-red-500 py-10">讀取資料庫發生錯誤</div>';
            }
        }

        async function downloadVideo(id) {
            try {
                const videos = await getAllVideosFromDB();
                const video = videos.find(v => v.id === id);
                if (video) {
                    const url = URL.createObjectURL(video.blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = video.filename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                }
            } catch (err) {
                alert("下載失敗：" + err);
            }
        }

        async function deleteVideoUI(id) {
            if(confirm('確定要刪除這個檔案嗎？')) {
                await deleteVideoFromDB(id);
                renderFileList(); 
            }
        }
    </script>
</body>
</html>
